<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lower ISEE Math Mastery Pathway</title><style>

px;margin:13px 0;border-radius:6px}.worked{border-left:4px solid var(--good);background:#eef9f3;padding:14px 16px;margin:12px 0;border-radius:6px}.progress{height:10px;background:#e4ebf2;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.mini{font-size:.87rem}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.metric{font-size:2rem;font-weight:800}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}select{padding:8px;border:1px solid var(--line);border-radius:8px;max-width:100%}.diagram{background:#f7fbff;border:1px solid var(--line);padding:12px;border-radius:10px;margin:12px 0;overflow:auto}.diagram svg{max-width:100%;height:auto}details{margin:12px 0}summary{cursor:pointer;font-weight:700}.tag{font-size:.78rem;color:var(--muted)}@media print{.top,.actions,.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}} .challenge{border:1px solid #d3e1ef;border-radius:12px;padding:14px;margin:14px 0;background:#f8fbff}.challenge h4{margin:0 0 8px}</style></head><body><header class="top"><h1>✦ Lower ISEE Math Mastery Pathway</h1><p>Quantitative Reasoning + Mathematics Achievement • Original ERB-aligned practice</p><nav class="nav"><button data-nav="home" class="active">Home</button><button data-nav="test" class="">Diagnostic / Mastery</button><button data-nav="practice" class="">Mini-lessons & Practice</button><button data-nav="results" class="">Results</button><button data-nav="library" class="">Tools</button><button data-nav="settings" class="">Settings</button></nav></header><main id="app"></main><script>
const ITEMS=[{"section": "QR", "ref": 1, "skill": "Fractional area models", "stem": "A triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?", "options": ["3/8", "3/5", "5/8", "1/3"], "answer": 0, "solution": "The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes.", "id": "QR-1", "lessonTitle": "Equal-area pieces", "lesson": "Count the equal-sized pieces representing the whole; count the selected pieces; write selected/total. If pieces differ in size, subdivide into equal areas.", "pdfpage": 12}, {"section": "QR", "ref": 2, "skill": "Multiplication situations", "stem": "Which situation is modeled by 8 × 6 = 48?", "options": ["48 stickers shared among 8 children", "8 packs with 6 stickers each", "8 stickers plus 6 stickers", "48 stickers with 6 removed"], "answer": 1, "solution": "Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction.", "id": "QR-2", "lessonTitle": "Multiplication situations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 3, "skill": "Intersecting inequalities", "stem": "A whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?", "options": ["12", "13", "14", "16"], "answer": 2, "solution": "The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14.", "id": "QR-3", "lessonTitle": "Intersecting inequalities", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 4, "skill": "Triangle perimeter", "stem": "A triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?", "options": ["9 cm", "11 cm", "25 cm", "28 cm"], "answer": 0, "solution": "Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm.", "id": "QR-4", "lessonTitle": "Triangle perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 5, "skill": "Two equations", "stem": "If 8 + a = 11 and 4 + b = 10, what is a + b?", "options": ["6", "7", "9", "13"], "answer": 2, "solution": "a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9.", "id": "QR-5", "lessonTitle": "Two equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 6, "skill": "Spatial completion", "stem": "A 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?", "options": ["7", "8", "9", "12"], "answer": 2, "solution": "A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9.", "id": "QR-6", "lessonTitle": "Visualize the complete grid", "lesson": "Find total cells from rows × columns. Count filled cells carefully, avoiding double-counting overlapping rows and columns.", "pdfpage": 13}, {"section": "QR", "ref": 7, "skill": "Proportional travel", "stem": "A cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?", "options": ["30 minutes", "36 minutes", "45 minutes", "54 minutes"], "answer": 2, "solution": "Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes.", "id": "QR-7", "lessonTitle": "Proportional travel", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 8, "skill": "Comparing fractions", "stem": "Which fraction is greatest?", "options": ["4/7", "5/11", "6/13", "7/16"], "answer": 0, "solution": "Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7.", "id": "QR-8", "lessonTitle": "Comparing fractions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 9, "skill": "Divisibility", "stem": "A positive integer is divisible by both 4 and 7. It must also be divisible by which number?", "options": ["11", "14", "21", "28"], "answer": 3, "solution": "Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28.", "id": "QR-9", "lessonTitle": "Divisibility", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 10, "skill": "Venn diagram intersections", "stem": "One circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?", "options": ["striped square", "solid triangle", "striped triangle", "solid circle"], "answer": 2, "solution": "An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular.", "id": "QR-10", "lessonTitle": "Both conditions must hold", "lesson": "The overlap of two circles represents the logical AND. Check every characteristic before selecting.", "pdfpage": 13}, {"section": "QR", "ref": 11, "skill": "Table pattern extrapolation", "stem": "A container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?", "options": ["68°", "70°", "71°", "72°"], "answer": 3, "solution": "Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°.", "id": "QR-11", "lessonTitle": "Analyze consecutive changes", "lesson": "Subtract each reading from the next. Identify a pattern in the differences and extend it rather than extrapolating from only two points.", "pdfpage": 14}, {"section": "QR", "ref": 12, "skill": "Input-output functions", "stem": "A table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?", "options": ["multiply by 3", "add 8", "add 6", "multiply by 2 then add 5"], "answer": 1, "solution": "Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8.", "id": "QR-12", "lessonTitle": "Input-output functions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 13, "skill": "Symbolic square perimeter", "stem": "A square has perimeter 12t. Which expression gives one side?", "options": ["3t", "4t", "6t", "12t"], "answer": 0, "solution": "All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t.", "id": "QR-13", "lessonTitle": "Symbolic square perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 14, "skill": "Solving linear equations", "stem": "Which value of x satisfies 22 = 4x + 6?", "options": ["2", "3", "4", "7"], "answer": 2, "solution": "Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22.", "id": "QR-14", "lessonTitle": "Solving linear equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 15, "skill": "Growing geometric patterns", "stem": "A triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?", "options": ["11", "13", "14", "15"], "answer": 1, "solution": "The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13.", "id": "QR-15", "lessonTitle": "Growing geometric patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 16, "skill": "Odd-number sum patterns", "stem": "What is 1 + 3 + 5 + 7 + 9 + 11 + 13?", "options": ["36", "42", "49", "56"], "answer": 2, "solution": "The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49.", "id": "QR-16", "lessonTitle": "Odd-number sum patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 17, "skill": "Circle graph fractions", "stem": "A circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?", "options": ["1/8", "1/4", "1/3", "1/2"], "answer": 1, "solution": "A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses.", "id": "QR-17", "lessonTitle": "Convert an angle to a fraction", "lesson": "A full circle is 360°. A sector’s fraction is sector angle ÷ 360°.", "pdfpage": 15}, {"section": "QR", "ref": 18, "skill": "Mean with mixed numbers", "stem": "Four parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?", "options": ["2 lb", "3 lb", "3.5 lb", "4 lb"], "answer": 1, "solution": "Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb.", "id": "QR-18", "lessonTitle": "Mean with mixed numbers", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 19, "skill": "Decimal number lines", "stem": "A number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?", "options": ["1.3", "1.5", "1.6", "1.8"], "answer": 2, "solution": "Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6.", "id": "QR-19", "lessonTitle": "Decimal number lines", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 20, "skill": "Segment subtraction", "stem": "Points A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?", "options": ["m + n", "m − n", "n − m", "mn"], "answer": 1, "solution": "The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n.", "id": "QR-20", "lessonTitle": "Segment subtraction", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 21, "skill": "Estimating products", "stem": "Which product best estimates 592 × 47?", "options": ["60 × 50", "600 × 5", "600 × 50", "500 × 40"], "answer": 2, "solution": "Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate.", "id": "QR-21", "lessonTitle": "Estimating products", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 22, "skill": "Cube volume", "stem": "A cube has edge length 4 units. What is its volume?", "options": ["12 cubic units", "16 cubic units", "48 cubic units", "64 cubic units"], "answer": 3, "solution": "Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units.", "id": "QR-22", "lessonTitle": "Cube volume", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 23, "skill": "Combining container volumes", "stem": "One measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?", "options": ["1/4 cup", "1 cup", "1 1/4 cups", "2 cups"], "answer": 2, "solution": "Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups.", "id": "QR-23", "lessonTitle": "Combining container volumes", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 24, "skill": "Symmetry and folds", "stem": "A figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?", "options": ["horizontal only", "vertical only", "both", "neither"], "answer": 1, "solution": "A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold.", "id": "QR-24", "lessonTitle": "Symmetry and folds", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 25, "skill": "Equal sharing and estimation", "stem": "A snack mix contains 8 cups cereal, 6 cups pretzels, 3 cups fruit, and 2 cups seeds. It is divided equally into 4 bags. Approximately how many cups per bag?", "options": ["2 cups", "4 cups", "5 cups", "8 cups"], "answer": 2, "solution": "Total = 8 + 6 + 3 + 2 = 19 cups. 19 ÷ 4 = 4.75 cups, approximately 5.", "id": "QR-25", "lessonTitle": "Equal sharing and estimation", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 26, "skill": "Scale drawings", "stem": "On a map, 1.5 inches represents 12 miles. How many inches represent 32 miles?", "options": ["2.5", "3", "4", "6"], "answer": 2, "solution": "Scale factor: 32 ÷ 12 = 8/3. Multiply 1.5 × 8/3 = 4 inches.", "id": "QR-26", "lessonTitle": "Scale drawings", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 27, "skill": "Probability and class totals", "stem": "In a class, the probability of selecting a student who rides the bus is 2/5. If 18 students do not ride the bus, how many do?", "options": ["8", "10", "12", "15"], "answer": 2, "solution": "Non-bus students represent 3/5. If 3 parts = 18, one part = 6. Bus riders are 2 parts = 12.", "id": "QR-27", "lessonTitle": "Translate the proportion", "lesson": "Use probability as part/whole. Convert the known complement into fractional parts of the whole.", "pdfpage": 17}, {"section": "QR", "ref": 28, "skill": "Counting unit cubes", "stem": "A rectangular solid is 3 cubes long, 4 cubes wide, and 2 cubes high. How many unit cubes fill it?", "options": ["9", "12", "18", "24"], "answer": 3, "solution": "Count layers: each layer contains 3 × 4 = 12 cubes. Two layers contain 12 × 2 = 24 cubes.", "id": "QR-28", "lessonTitle": "Counting unit cubes", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 29, "skill": "Bar graph inferences", "stem": "Four students read 12, 18, 24, and 26 minutes. Which statement is true?", "options": ["mean is 20 minutes", "range is 20 minutes", "median is 24 minutes", "all times are even multiples of 6"], "answer": 0, "solution": "Mean = (12 + 18 + 24 + 26) ÷ 4 = 80 ÷ 4 = 20. Range = 14; median = 21.", "id": "QR-29", "lessonTitle": "Bar graph inferences", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 18}, {"section": "QR", "ref": 30, "skill": "Translating verbal equations", "stem": "Which equation represents “three less than five times a number equals eight more than the number”?", "options": ["5n − 3 = n + 8", "3 − 5n = n + 8", "5(n − 3) = 8n", "5n + 3 = n − 8"], "answer": 0, "solution": "Five times a number is 5n. Three less is 5n − 3. Eight more than the number is n + 8.", "id": "QR-30", "lessonTitle": "Translating verbal equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 18}, {"section": "QR", "ref": 31, "skill": "Polygon triangulation", "stem": "How many triangles result when a convex 8-sided polygon is divided by diagonals drawn from one vertex to all nonadjacent vertices?", "options": ["5", "6", "7", "8"], "answer": 1, "solution": "Triangulating a convex n-gon from one vertex makes n − 2 triangles. For 8 sides, 8 − 2 = 6.", "id": "QR-31", "lessonTitle": "Polygo function home(){let d1=score('QR','diag'),d2=score('MA','diag'),m1=score('QR','mastery'),m2=score('MA','mastery');return `<div class="card"><span class="pill">LOWER LEVEL • MATHEMATICS ONLY</span><h2>ISEE Math Mastery Pathway</h2><p>60 original diagnostic questions individually mapped to the 2016 ERB Lower Level practice test: 35 Quantitative Reasoning and 25 Mathematics Achievement. Each question includes a mini-lesson, guided reasoning, and a complete worked solution.</p><div class="notice"><strong>Test authenticity:</strong> The official practice math sections are 35 questions/34 minutes and 25 questions/25 minutes. The actual exam uses 38/35 minutes and 30/30 minutes. These questions are original parallels, not reproduced ERB questions or a validated score predictor.</div></div><div class="grid">${[['Quantitative Reasoning',d1,'QR'],['Mathematics Achievement',d2,'MA']].map(([name,s,k])=>card(`<h3>${name}</h3><div class="metric">${s.answered}/${s.total}</div><p class="muted">Diagnostic completed</p>${bar(s.answered,s.total)}<div class="actions">${button('Open diagnostic',`openTest('diag','${k}')`)} ${button(unlocked()?'Final assessment':'Final assessment 🔒',`openTest('mastery','${k}')`,'secondary')}</div>`)).join('')}${card(`<h3>Targeted remediation</h3><div class="metric">${ITEMS.filter(q=>result(q,'diag')!==undefined&&result(q,'diag')!==q.answer).length}</div><p class="muted">Missed diagnostic questions requiring guided review</p>${button('Open practice',"setPage('practice')")}`)}</div><div class="card"><h3>How the pathway works</h3><p><strong>1. Diagnose:</strong> optional hints are available, but hinted correct answers do not earn mastery credit. <strong>2. Learn:</strong> access skill-specific mini-lessons and worked examples for missed items. <strong>3. Practice:</strong> retry independently with feedback and an error-analysis prompt. <strong>4. Verify:</strong> unlock the 68-question final assessment by mastering every unit through an unassisted diagnostic answer or all three practice challenges. <strong>5. Review:</strong> revisit the formula and strategy library.</p><p class="muted mini">For strongest validity, use the attached ERB practice test as a separate external benchmark after mastering this original question bank. The 68-question final reuses 60 diagnostic items and adds 8 new, more demanding items, so it is not a fully independent alternate form.</p></div>`}
function openTest(m,s){if(m==='mastery'&&!unlocked()){alert('Final assessment is locked until all 60 units are mastered through an unassisted diagnostic answer or all three practice challenges.');setPage('practice');return}mode=m;section=s;index=0;showFeedback=false;setPage('test')}
function choose(i){let q=testQs(section,mode)[index];if(mode==='diag'){state.diag[q.id]=i}else{state.mastery[q.id]=i}save();render()}
function test(){let a=testQs(section,mode),q=a[index],ans=result(q,mode),s=score(section,mode),label=mode==='diag'?'Diagnostic':'Mastery check';return `<div class="row"><h2>${label} • ${section==='QR'?'Quantitative Reasoning':'Mathematics Achievement'}</h2><span class="pill">Question ${index+1} of ${a.length}</span></div>${bar(s.answered,s.total)}<p class="muted mini">${s.answered} answered • ${section==='QR'?'34-minute ERB practice pacing':'25-minute ERB practice pacing'} • Work independently; explanations are hidden during testing.</p>${card(`<div class="row"><span class="pill">${esc(q.skill)}</span><span class="tag">Aligned to ERB ${section} #${q.ref} • PDF p. ${q.pdfpage}</span></div><div class="question">${esc(q.stem)}</div>${diagram(q)}${mode==='diag'?`<div class="actions">${button(state.hints[q.id]?'Hint viewed — no mastery credit':'Show hint (forfeits mastery credit)','revealHint()','secondary')}</div>${state.hints[q.id]?`<div class="notice"><strong>Hint used:</strong> ${esc(hintText(q))}<p>Correct answers after a hint are recorded, but do not earn diagnostic mastery credit.</p></div>`:''}`:''}${q.options.map((o,i)=>`<button class="choice ${ans===i?'selected':''}" onclick="choose(${i})"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}<div class="actions">${button('Previous',"step(-1)",'secondary')}${button('Next',"step(1)")}${button('Section results',"setPage('results')",'ghost')}</div>`)}<p class="muted mini">Your answers are saved in this browser. Return to unanswered items before submitting your practice session.</p>`}
function step(n){index=Math.max(0,Math.min(testQs(section,mode).length-1,index+n));render();window.scrollTo(0,0)}
function practice(){let missed=ITEMS.filter(q=>!mastered(q)),all=ITEMS.filter(q=>result(q,'diag')!==undefined),pool=filter==='missed'?missed:filter==='all'?ITEMS:all;if(!practiceId||!pool.some(q=>q.id===practiceId))practiceId=pool[0]?.id;let q=byId(practiceId);return `<h2>Targeted mini-lessons & guided practice</h2><div class="card"><div class="row"><p class="muted">${missed.length} diagnostic misses • Choose a question below. Missed items appear first.</p><select onchange="filter=this.value;practiceId=null;render()"><option value="all" ${filter==='all'?'selected':''}>All 60 aligned skills</option><option value="missed" ${filter==='missed'?'selected':''}>Missed only</option><option value="attempted" ${filter==='attempted'?'selected':''}>Attempted only</option></select></div><select style="width:100%" onchange="practiceId=this.value;render()">${[...pool].sort((a,b)=>(status(a)==='Needs review'?-1:1)-(status(b)==='Needs review'?-1:1)).map(x=>`<option value="${x.id}" ${practiceId===x.id?'selected':''}>${x.id} • ${esc(x.skill)} • ${status(x)}</option>`).join('')}</select></div>${q?practiceCard(q):card('No questions in this filter yet. Complete a diagnostic first.')}`}
function practiceCard(q){let d=result(q,'diag'),p=result(q,'practice');return card(`<div class="row"><h3>${esc(q.skill)}</h3><span class="pill">ERB ${q.section} #${q.ref} • PDF p. ${q.pdfpage}</span></div><p><strong>Diagnostic:</strong> ${status(q)}</p><h3>Mini-lesson: ${esc(q.lessonTitle)}</h3><div class="notice">${esc(q.lesson)}</div><h3>Guided example & reasoning</h3><p class="muted mini">Read the original parallel question, plan a solution, then reveal the worked example. This example also serves as the mandatory diagnostic correction when missed.</p><div class="question">${esc(q.stem)}</div>${diagram(q)}<details ${d!==undefined&&!diagCredit(q)?'open':''}><summary>Show full guided solution${d!==undefined&&!diagCredit(q)?' (diagnostic correction)':''}</summary><div class="worked"><strong>Correct answer: ${'ABCD'[q.answer]} — ${esc(q.options[q.answer])}</strong><p>${esc(q.solution)}</p><strong>Check:</strong> Substitute or estimate to confirm that the result satisfies the question. Explain why at least one distractor is incorrect.</div></details><h3>Independent retrieval practice</h3><p class="muted mini">Close the worked solution, solve again without looking, then select your answer. Repeated questions test recall rather than independent transfer.</p>${q.options.map((o,i)=>`<button class="choice ${p===i?(p===q.answer?'correct':'wrong'):''}" onclick="state.practice['${q.id}']=${i};save();render()"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${p!==undefined?`<div class="${p===q.answer?'worked':'notice'}"><strong>${p===q.answer?'Correct.':'Not yet correct.'}</strong> ${esc(q.solution)}</div>`:''}<h3>Three additional reasoning challenges</h3><p class="muted mini">Complete all three correctly to demonstrate practice mastery. Each challenge is tracked independently; incorrect responses can be retried. These challenges currently reinforce the same source-aligned scenario and are not independent alternate forms.</p>${EXTRAS[q.id].map((e,j)=>`<div class="challenge"><h4>Challenge ${j+1} of 3</h4><p>${esc(e.stem)}</p>${e.options.map((o,k)=>`<button class="choice ${state.extra[q.id+'-'+j]===k?(k===e.answer?'correct':'wrong'):''}" onclick="state.extra['${q.id}-'+${j}]=${k};save();render()"><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}${state.extra[q.id+'-'+j]!==undefined?`<div class="worked">${state.extra[q.id+'-'+j]===e.answer?'Correct.':'Try again.'} ${esc(e.solution)}</div>`:''}</div>`).join('')}<p><strong>Unit mastery:</strong> ${mastered(q)?'Mastered':'Not yet mastered'}</p><h3>Reflection checklist</h3><label><input type="checkbox" ${state.flags[q.id]?'checked':''} onchange="state.flags['${q.id}']=this.checked;save()"> I can explain the method and identify my original error.</label><div class="actions">${button('Next assigned item',"nextPractice()")}${button('See all results',"setPage('results')",'secondary')}</div>`)}
function nextPractice(){let pool=filter==='missed'?ITEMS.filter(q=>status(q)==='Needs review'):filter==='attempted'?ITEMS.filter(q=>result(q,'diag')!==undefined):ITEMS;let i=pool.findIndex(q=>q.id===practiceId);practiceId=pool[(i+1)%pool.length]?.id;render();window.scrollTo(0,0)}
function results(){let a=score('QR','diag'),b=score('MA','diag'),c=score('QR','mastery'),d=score('MA','mastery');return `<h2>Results & diagnostic error analysis</h2><p><strong>Units mastered:</strong> ${ITEMS.filter(mastered).length}/60 • <strong>Final assessment:</strong> ${unlocked()?'Unlocked':'Locked'} • <strong>Correct with hint:</strong> ${ITEMS.filter(q=>state.hints[q.id]&&result(q,'diag')===q.answer).length}</p><div class="grid">${[['QR diagnostic',a],['MA diagnostic',b],['QR mastery check',c],['MA mastery check',d]].map(([n,s])=>card(`<h3>${n}</h3><div class="metric">${s.correct}/${s.total}</div><p class="muted">${s.answered} attempted • ${s.answered?Math.round(100*s.correct/s.answered):0}% of attempted correct</p>${bar(s.correct,s.total)}`)).join('')}</div><div class="card"><h3>Item-by-item alignment and remediation</h3><p class="muted mini">Every row is linked to the corresponding numbered question in the uploaded ERB test. Incorrect diagnostic answers receive a complete worked correction in Practice.</p><div style="overflow:auto"><table><thead><tr><th>ERB ref</th><th>Skill</th><th>Diagnostic</th><th>Practice</th><th>Mastery</th><th>Correction</th></tr></thead><tbody>${ITEMS.map(q=>`<tr><td>${q.id}</td><td>${esc(q.skill)}</td><td>${status(q)}</td><td>${result(q,'practice')===undefined?'—':result(q,'practice')===q.answer?'Correct':'Retry'}</td><td>${result(q,'mastery')===undefined?'—':result(q,'mastery')===q.answer?'Correct':'Incorrect'}</td><td><button class="btn secondary" onclick="practiceId='${q.id}';filter='all';setPage('practice')">Open lesson</button></td></tr>`).join('')}</tbody></table></div></div><div class="actions">${button('Export progress',"exportProgress()")}${button('Print results',"window.print()",'secondary')}</div>`}
function library(){return `<h2>Math tools & test strategy library</h2><div class="grid">${[
['Number sense','Fractions: a/b means a equal parts out of b. Equivalent fractions: multiply top and bottom by the same nonzero number. Compare fractions using common denominators or cross-products.'],
['Operations','PEMDAS: parentheses, exponents, multiplication/division left to right, addition/subtraction left to right. For a mixed number, convert to an improper fraction when useful.'],
['Geometry','Triangle perimeter = a + b + c; rectangle perimeter P = 2l + 2w; rectangle area A = lw; square perimeter P = 4s; cube volume V = s³; rectangular prism V = lwh.'],
['Rates and ratios','Unit rate = total quantity ÷ number of units. Proportion a/b = c/d. Scale drawing: use equivalent ratios with consistent units.'],
['Statistics and probability','Mean = sum ÷ number of observations. Median = middle value after sorting. Mode = most frequent value. Range = maximum − minimum. Probability = favorable outcomes ÷ total equally likely outcomes.'],
['Symbols','x, n, p, q = variables; ℓ = length; w = width; s = side; P = perimeter or probability depending on context; A = area; V = volume; ° = degrees; ≈ = approximately equal; ≥ = at least; ≤ = at most; ∩ = intersection.'],
['Graphs','For tables and bar graphs, read the scale and units before calculating. Circle graphs: sector fraction = angle/360°. Coordinate pairs are (x, y).'],
['Test-taking','Estimate before calculating; eliminate implausible choices; watch units; reread “not,” “approximately,” and “best”; do not spend too long on one item; answer every question because the ISEE has no wrong-answer penalty.']
].map(([t,b])=>card(`<h3>${t}</h3><p>${b}</p>`)).join('')}</div><div class="card"><h3>Source and alignment notes</h3><p>Based on the uploaded 2016 ERB Lower Level ISEE Practice Test 1. Each original question is tagged to its counterpart by section and question number. Diagrams in this app are newly created schematic aids; some diagram-dependent parallels use a simplified visual representation and are not exact reproductions of ERB artwork.</p><p>The question bank deliberately covers the 60 official practice-test math item types, not the verbal or reading sections. This is independent preparation material, not an official ERB product.</p></div>`}
function settings(){return card(`<h2>Data & settings</h2><p>Progress is stored in this browser. Export a JSON backup to transfer between devices, then import it on the destination device. Import replaces the current browser's progress.</p><div class="actions">${button('Export progress JSON',"exportProgress()")} <label class="btn secondary" style="display:inline-block;cursor:pointer">Import progress JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></label>${button('Reset progress',"resetProgress()",'secondary')}</div><p class="muted mini">There is no server synchronization, student login, or teacher dashboard in this standalone version.</p>`)}
function exportProgress(){let data=JSON.stringify({exportedAt:new Date().toISOString(),progress:state},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='isee-math-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(el){let file=el.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text()),v=data.progress??data;if(!v||typeof v!=='object'||!['diag','practice','mastery'].every(k=>v[k]&&typeof v[k]==='object'&&!Array.isArray(v[k])))throw Error('Invalid progress structure');if(!confirm('Replace progress in this browser with the imported file?'))return;state={diag:v.diag,practice:v.practice,mastery:v.mastery,flags:v.flags??{},hints:v.hints??{},extra:v.extra??{}};save();render();alert('Progress imported successfully.')}catch(e){alert('Import failed: '+e.message)}finally{el.value=''}}
function resetProgress(){if(confirm('Delete all locally saved ISEE Math progress?')){state={diag:{},practice:{},mastery:{},flags:{},hints:{},extra:{}};save();setPage('home')}}
function render(){app.innerHTML=page==='home'?home():page==='test'?test():page==='practice'?practice():page==='results'?results():page==='library'?library():settings()}
document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>setPage(x.dataset.nav));render();
</script></body></html>
