<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lower ISEE Math Mastery Pathway</title><style>

px;margin:13px 0;border-radius:6px}.worked{border-left:4px solid var(--good);background:#eef9f3;padding:14px 16px;margin:12px 0;border-radius:6px}.progress{height:10px;background:#e4ebf2;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.mini{font-size:.87rem}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.metric{font-size:2rem;font-weight:800}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}select{padding:8px;border:1px solid var(--line);border-radius:8px;max-width:100%}.diagram{background:#f7fbff;border:1px solid var(--line);padding:12px;border-radius:10px;margin:12px 0;overflow:auto}.diagram svg{max-width:100%;height:auto}details{margin:12px 0}summary{cursor:pointer;font-weight:700}.tag{font-size:.78rem;color:var(--muted)}@media print{.top,.actions,.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}} .challenge{border:1px solid #d3e1ef;border-radius:12px;padding:14px;margin:14px 0;background:#f8fbff}.challenge h4{margin:0 0 8px}.tool-header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.tool-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 20px}.tool-tab{border:1px solid var(--line);border-radius:24px;padding:9px 15px;background:white;color:var(--navy);font-weight:700}.tool-tab.active{background:var(--navy);color:white}.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.flashcard{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;border:2px solid #c9dded;border-radius:16px;background:linear-gradient(145deg,#fff,#eaf5ff);color:var(--navy);padding:24px;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:0 5px 16px #142c4b0a}.flashcard:hover{transform:translateY(-3px);border-color:var(--blue)}.flashcard:focus-visible{outline:3px solid #3875bd;outline-offset:3px}.flashcard.flipped{background:linear-gradient(145deg,#f1faf7,#fff);border-color:#70b49b}.flashcard .front{font-size:1.25rem;font-weight:800}.flashcard .back{font-size:1.08rem;font-weight:650}.flashcard .card-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.tool-panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:16px}.tool-panel h3{color:var(--navy);margin-top:0}.tool-definition{padding:12px 0;border-bottom:1px solid var(--line)}.tool-definition:last-child{border-bottom:0}.tool-definition strong{display:block;color:var(--navy)}.tool-search{padding:11px 14px;border:1px solid var(--line);border-radius:10px;width:min(100%,360px);font:inherit}.tool-intro{color:var(--muted);max-width:760px}.tool-tip{font-size:.84rem;color:var(--muted)}@media(max-width:600px){.tool-grid{grid-template-columns:1fr}.flashcard{min-height:160px}}.pathway{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:22px}.pathway-label{font-weight:800;color:var(--navy);font-size:.85rem;letter-spacing:.04em;display:flex;justify-content:space-between;gap:10px}.pathway-label span{font-weight:500;color:var(--muted)}.pathway-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}.pathway-step{border:1px solid #cddfeb;border-radius:11px;background:#f5f9fc;padding:10px 7px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;color:var(--navy);font-size:.78rem;font-weight:700;min-height:94px}.pathway-step.current{background:#d9eaf9;border:2px solid var(--blue)}.pathway-step.done{border-color:#82bda7}.pathway-step small{font-weight:500;color:var(--muted)}.step-number{display:grid;place-items:center;border-radius:50%;width:25px;height:25px;background:var(--navy);color:white}.next-stage{margin-top:20px}@media(max-width:760px){.pathway-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.pathway-label{flex-direction:column}}@media(max-width:440px){.pathway-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

const ITEMS=[{"section": "QR", "ref": 1, "skill": "Fractional area models", "stem": "A triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?", "options": ["3/8", "3/5", "5/8", "1/3"], "answer": 0, "solution": "The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes.", "id": "QR-1", "lessonTitle": "Equal-area pieces", "lesson": "Count the equal-sized pieces representing the whole; count the selected pieces; write selected/total. If pieces differ in size, subdivide into equal areas.", "pdfpage": 12}, {"section": "QR", "ref": 2, "skill": "Multiplication situations", "stem": "Which situation is modeled by 8 × 6 = 48?", "options": ["48 stickers shared among 8 children", "8 packs with 6 stickers each", "8 stickers plus 6 stickers", "48 stickers with 6 removed"], "answer": 1, "solution": "Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction.", "id": "QR-2", "lessonTitle": "Multiplication situations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 3, "skill": "Intersecting inequalities", "stem": "A whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?", "options": ["12", "13", "14", "16"], "answer": 2, "solution": "The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14.", "id": "QR-3", "lessonTitle": "Intersecting inequalities", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 4, "skill": "Triangle perimeter", "stem": "A triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?", "options": ["9 cm", "11 cm", "25 cm", "28 cm"], "answer": 0, "solution": "Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm.", "id": "QR-4", "lessonTitle": "Triangle perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 5, "skill": "Two equations", "stem": "If 8 + a = 11 and 4 + b = 10, what is a + b?", "options": ["6", "7", "9", "13"], "answer": 2, "solution": "a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9.", "id": "QR-5", "lessonTitle": "Two equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 6, "skill": "Spatial completion", "stem": "A 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?", "options": ["7", "8", "9", "12"], "answer": 2, "solution": "A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9.", "id": "QR-6", "lessonTitle": "Visualize the complete grid", "lesson": "Find total cells from rows × columns. Count filled cells carefully, avoiding double-counting overlapping rows and columns.", "pdfpage": 13}, {"section": "QR", "ref": 7, "skill": "Proportional travel", "stem": "A cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?", "options": ["30 minutes", "36 minutes", "45 minutes", "54 minutes"], "answer": 2, "solution": "Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes.", "id": "QR-7", "lessonTitle": "Proportional travel", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 8, "skill": "Comparing fractions", "stem": "Which fraction is greatest?", "options": ["4/7", "5/11", "6/13", "7/16"], "answer": 0, "solution": "Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7.", "id": "QR-8", "lessonTitle": "Comparing fractions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 9, "skill": "Divisibility", "stem": "A positive integer is divisible by both 4 and 7. It must also be divisible by which number?", "options": ["11", "14", "21", "28"], "answer": 3, "solution": "Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28.", "id": "QR-9", "lessonTitle": "Divisibility", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 10, "skill": "Venn diagram intersections", "stem": "One circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?", "options": ["striped square", "solid triangle", "striped triangle", "solid circle"], "answer": 2, "solution": "An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular.", "id": "QR-10", "lessonTitle": "Both conditions must hold", "lesson": "The overlap of two circles represents the logical AND. Check every characteristic before selecting.", "pdfpage": 13}, {"section": "QR", "ref": 11, "skill": "Table pattern extrapolation", "stem": "A container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?", "options": ["68°", "70°", "71°", "72°"], "answer": 3, "solution": "Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°.", "id": "QR-11", "lessonTitle": "Analyze consecutive changes", "lesson": "Subtract each reading from the next. Identify a pattern in the differences and extend it rather than extrapolating from only two points.", "pdfpage": 14}, {"section": "QR", "ref": 12, "skill": "Input-output functions", "stem": "A table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?", "options": ["multiply by 3", "add 8", "add 6", "multiply by 2 then add 5"], "answer": 1, "solution": "Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8.", "id": "QR-12", "lessonTitle": "Input-output functions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 13, "skill": "Symbolic square perimeter", "stem": "A square has perimeter 12t. Which expression gives one side?", "options": ["3t", "4t", "6t", "12t"], "answer": 0, "solution": "All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t.", "id": "QR-13", "lessonTitle": "Symbolic square perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 14, "skill": "Solving linear equations", "stem": "Which value of x satisfies 22 = 4x + 6?", "options": ["2", "3", "4", "7"], "answer": 2, "solution": "Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22.", "id": "QR-14", "lessonTitle": "Solving linear equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 15, "skill": "Growing geometric patterns", "stem": "A triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?", "options": ["11", "13", "14", "15"], "answer": 1, "solution": "The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13.", "id": "QR-15", "lessonTitle": "Growing geometric patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 16, "skill": "Odd-number sum patterns", "stem": "What is 1 + 3 + 5 + 7 + 9 + 11 + 13?", "options": ["36", "42", "49", "56"], "answer": 2, "solution": "The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49.", "id": "QR-16", "lessonTitle": "Odd-number sum patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 17, "skill": "Circle graph fractions", "stem": "A circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?", "options": ["1/8", "1/4", "1/3", "1/2"], "answer": 1, "solution": "A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses.", "id": "QR-17", "lessonTitle": "Convert an angle to a fraction", "lesson": "A full circle is 360°. A sector’s fraction is sector angle ÷ 360°.", "pdfpage": 15}, {"section": "QR", "ref": 18, "skill": "Mean with mixed numbers", "stem": "Four parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?", "options": ["2 lb", "3 lb", "3.5 lb", "4 lb"], "answer": 1, "solution": "Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb.", "id": "QR-18", "lessonTitle": "Mean with mixed numbers", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 19, "skill": "Decimal number lines", "stem": "A number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?", "options": ["1.3", "1.5", "1.6", "1.8"], "answer": 2, "solution": "Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6.", "id": "QR-19", "lessonTitle": "Decimal number lines", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 20, "skill": "Segment subtraction", "stem": "Points A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?", "options": ["m + n", "m − n", "n − m", "mn"], "answer": 1, "solution": "The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n.", "id": "QR-20", "lessonTitle": "Segment subtraction", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 21, "skill": "Estimating products", "stem": "Which product best estimates 592 × 47?", "options": ["60 × 50", "600 × 5", "600 × 50", "500 × 40"], "answer": 2, "solution": "Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate.", "id": "QR-21", "lessonTitle": "Estimating products", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 22, "skill": "Cube volume", "stem": "A cube has edge length 4 units. What is its volume?", "options": ["12 cubic units", "16 cubic units", "48 cubic units", "64 cubic units"], "answer": 3, "solution": "Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units.", "id": "QR-22", "lessonTitle": "Cube volume", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 23, "skill": "Combining container volumes", "stem": "One measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?", "options": ["1/4 cup", "1 cup", "1 1/4 cups", "2 cups"], "answer": 2, "solution": "Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups.", "id": "QR-23", "lessonTitle": "Combining container volumes", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 24, "skill": "Symmetry and folds", "stem": "A figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?", "options": ["horizontal only", "vertical only", "both", "neither"], "answer": 1, "solution": "A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold.", "id": "QR-24", "lessonTitle": "Symmetry and folds", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 25, "skill": "Equal sharing and estimation", "stem": "A snack mix contains 8 cups cereal, 6 cups pretzels, 3 cups fruit, and 2 cups seeds. It is divided equally into 4 bags. Approximately how many cups per bag?", "options": ["2 cups", "4 cups", "5 cups", "8 cups"], "answer": 2, "solution": "Total = 8 + 6 + 3 + 2 = 19 cups. 19 ÷ 4 = 4.75 cups, approximately 5.", "id": "QR-25", "lessonTitle": "Equal sharing and estimation", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 26, "skill": "Scale drawings", "stem": "On a map, 1.5 inches represents 12 miles. How many inches represent 32 miles?", "options": ["2.5", "3", "4", "6"], "answer": 2, "solution": "Scale factor: 32 ÷ 12 = 8/3. Multiply 1.5 × 8/3 = 4 inches.", "id": "QR-26", "lessonTitle": "Scale drawings", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 27, "skill": "Probability and class totals", "stem": "In a class, the probability of selecting a student who rides the bus is 2/5. If 18 students do not ride the bus, how many do?", "options": ["8", "10", "12", "15"], "answer": 2, "solution": "Non-bus students represent 3/5. If 3 parts = 18, one part = 6. Bus riders are 2 parts = 12.", "id": "QR-27", "lessonTitle": "Translate the proportion", "lesson": "Use probability as part/whole. Convert the known complement into fractional parts of the whole.", "pdfpage": 17}, {"section": "QR", "ref": 28, "skill": "Counting unit cubes", "stem": "A rectangular solid is 3 cubes long, 4 cubes wide, and 2 cubes high. How many unit cubes fill it?", "options": ["9", "12", "18", "24"], "answer": 3, "solution": "Count layers: each layer contains 3 × 4 = 12 cubes. Two layers contain 12 × 2 = 24 cubes.", "id": "QR-28", "lessonTitle": "Counting unit cubes", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", "ref": 29, "skill": "Bar graph inferences", "stem": "Four students read 12, 18, 24, and 26 minutes. Which statement is true?", "options": ["mean is 20 minutes", "range is 20 minutes", "median is 24 minutes", "all times are even multiples of 6"], "answer": 0, "solution": "Mean = (12 + 18 + 24 + 26) ÷ 4 = 80 ÷ 4 = 20. Range = 14; median = 21.", "id": "QR-29", "lessonTitle": "Bar graph inferences", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 18}, {"section": "QR", "ref": 30, "skill": "Translating verbal equations", "stem": "Which equation represents “three less than five times a number equals eight more than the number”?", "options": ["5n − 3 = n + 8", "3 − 5n = n + 8", "5(n − 3) = 8n", "5n + 3 = n − 8"], "answer": 0, "solution": "Five times a number is 5n. Three less is 5n − 3. Eight more than the number is n + 8.", "id": "QR-30", "lessonTitle": "Translating verbal equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 18}, {"section": "QR", "ref": 31, "skill": "Polygon triangulation", "stem": "How many triangles result when a convex 8-sided polygon is divided by diagonals drawn from one vertex to all nonadjacent vertices?", "options": ["5", "6", "7", "8"], "answer": 1, "solution": "Triangulating a convex n-gon from one vertex makes n − 2 triangles. For 8 sides, 8 − 2 = 6.", "id": "QR-31", "lessonTitle": "Polygon triangulation", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 18}, {"section": "QR", "ref": 32, "skill": "Equivalent probabilities", "stem": "A bag contains red and other marbles. Which composition makes the probability of red exactly 3/8?", "options": ["3 red and 8 other", "6 red and 10 other", "9 red and 12 other", "12 red and 16 other"], "answer": 1, "solution": "Probability = red ÷ total. With 6 red and 10 other, total is 16 and 6/16 = 3/8.", "id": "QR-32", "lessonTitle": "Favorable over total", "lesson": "The denominator counts ALL objects, not just objects that are not favorable.", "pdfpage": 18}, {"section": "QR", "ref": 33, "skill": "Reasonable estimates", "stem": "A student calculates 49 × 38. Which interval contains a reasonable estimate?", "options": ["500–900", "1,000–1,300", "1,700–2,100", "2,600–3,000"], "answer": 2, "solution": "Round 49 to 50 and 38 to 40. 50 × 40 = 2,000, inside 1,700–2,100.", "id": "QR-33", "lessonTitle": "Reasonable estimates", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 19}, {"section": "QR", "ref": 34, "skill": "Numerical expressions", "stem": "What is the value of (24 + 16) × 30 ÷ 4?", "options": ["120", "240", "300", "480"], "answer": 2, "solution": "Parentheses first: 24 + 16 = 40. Then 40 × 30 ÷ 4 = 1,200 ÷ 4 = 300.", "id": "QR-34", "lessonTitle": "Numerical expressions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 19}, {"section": "QR", "ref": 35, "skill": "Reverse mean problems", "stem": "The average of 10 and another number is 17. Wh const EXTRAS={"QR-1":[{"stem":"Skill builder · Equal-area pieces\nA triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?","options":["3/8","3/5","5/8","1/3"],"answer":0,"solution":"The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes."},{"stem":"Spot the mistake · A student chose “3/5.” What should the answer be instead?\nA triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?","options":["3/5","5/8","3/8","1/3"],"answer":2,"solution":"The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes."},{"stem":"Explain your thinking · Count the equal-sized pieces representing the whole; count the selected pieces; write selected/total. If pieces differ in size, subdivide into equal areas.\nNow check this example: A triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?","options":["1/3","3/8","3/5","5/8"],"answer":1,"solution":"The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes."}],"QR-2":[{"stem":"Skill builder · Multiplication situations\nWhich situation is modeled by 8 × 6 = 48?","options":["48 stickers shared among 8 children","8 packs with 6 stickers each","8 stickers plus 6 stickers","48 stickers with 6 removed"],"answer":1,"solution":"Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction."},{"stem":"Spot the mistake · A student chose “48 stickers shared among 8 children.” What should the answer be instead?\nWhich situation is modeled by 8 × 6 = 48?","options":["48 stickers shared among 8 children","8 stickers plus 6 stickers","8 packs with 6 stickers each","48 stickers with 6 removed"],"answer":2,"solution":"Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Which situation is modeled by 8 × 6 = 48?","options":["48 stickers with 6 removed","8 packs with 6 stickers each","48 stickers shared among 8 children","8 stickers plus 6 stickers"],"answer":1,"solution":"Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction."}],"QR-3":[{"stem":"Skill builder · Intersecting inequalities\nA whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?","options":["12","13","14","16"],"answer":2,"solution":"The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14."},{"stem":"Spot the mistake · A student chose “12.” What should the answer be instead?\nA whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?","options":["12","13","14","16"],"answer":2,"solution":"The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?","options":["16","14","12","13"],"answer":1,"solution":"The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14."}],"QR-4":[{"stem":"Skill builder · Triangle perimeter\nA triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?","options":["9 cm","11 cm","25 cm","28 cm"],"answer":0,"solution":"Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm."},{"stem":"Spot the mistake · A student chose “11 cm.” What should the answer be instead?\nA triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?","options":["11 cm","25 cm","9 cm","28 cm"],"answer":2,"solution":"Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?","options":["28 cm","9 cm","11 cm","25 cm"],"answer":1,"solution":"Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm."}],"QR-5":[{"stem":"Skill builder · Two equations\nIf 8 + a = 11 and 4 + b = 10, what is a + b?","options":["6","7","9","13"],"answer":2,"solution":"a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9."},{"stem":"Spot the mistake · A student chose “6.” What should the answer be instead?\nIf 8 + a = 11 and 4 + b = 10, what is a + b?","options":["6","7","9","13"],"answer":2,"solution":"a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: If 8 + a = 11 and 4 + b = 10, what is a + b?","options":["13","9","6","7"],"answer":1,"solution":"a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9."}],"QR-6":[{"stem":"Skill builder · Visualize the complete grid\nA 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?","options":["7","8","9","12"],"answer":2,"solution":"A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9."},{"stem":"Spot the mistake · A student chose “7.” What should the answer be instead?\nA 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?","options":["7","8","9","12"],"answer":2,"solution":"A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9."},{"stem":"Explain your thinking · Find total cells from rows × columns. Count filled cells carefully, avoiding double-counting overlapping rows and columns.\nNow check this example: A 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?","options":["12","9","7","8"],"answer":1,"solution":"A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9."}],"QR-7":[{"stem":"Skill builder · Proportional travel\nA cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?","options":["30 minutes","36 minutes","45 minutes","54 minutes"],"answer":2,"solution":"Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes."},{"stem":"Spot the mistake · A student chose “30 minutes.” What should the answer be instead?\nA cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?","options":["30 minutes","36 minutes","45 minutes","54 minutes"],"answer":2,"solution":"Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?","options":["54 minutes","45 minutes","30 minutes","36 minutes"],"answer":1,"solution":"Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes."}],"QR-8":[{"stem":"Skill builder · Comparing fractions\nWhich fraction is greatest?","options":["4/7","5/11","6/13","7/16"],"answer":0,"solution":"Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7."},{"stem":"Spot the mistake · A student chose “5/11.” What should the answer be instead?\nWhich fraction is greatest?","options":["5/11","6/13","4/7","7/16"],"answer":2,"solution":"Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Which fraction is greatest?","options":["7/16","4/7","5/11","6/13"],"answer":1,"solution":"Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7."}],"QR-9":[{"stem":"Skill builder · Divisibility\nA positive integer is divisible by both 4 and 7. It must also be divisible by which number?","options":["11","14","21","28"],"answer":3,"solution":"Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28."},{"stem":"Spot the mistake · A student chose “11.” What should the answer be instead?\nA positive integer is divisible by both 4 and 7. It must also be divisible by which number?","options":["11","14","28","21"],"answer":2,"solution":"Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A positive integer is divisible by both 4 and 7. It must also be divisible by which number?","options":["21","28","11","14"],"answer":1,"solution":"Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28."}],"QR-10":[{"stem":"Skill builder · Both conditions must hold\nOne circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?","options":["striped square","solid triangle","striped triangle","solid circle"],"answer":2,"solution":"An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular."},{"stem":"Spot the mistake · A student chose “striped square.” What should the answer be instead?\nOne circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?","options":["striped square","solid triangle","striped triangle","solid circle"],"answer":2,"solution":"An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular."},{"stem":"Explain your thinking · The overlap of two circles represents the logical AND. Check every characteristic before selecting.\nNow check this example: One circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?","options":["solid circle","striped triangle","striped square","solid triangle"],"answer":1,"solution":"An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular."}],"QR-11":[{"stem":"Skill builder · Analyze consecutive changes\nA container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?","options":["68°","70°","71°","72°"],"answer":3,"solution":"Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°."},{"stem":"Spot the mistake · A student chose “68°.” What should the answer be instead?\nA container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?","options":["68°","70°","72°","71°"],"answer":2,"solution":"Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°."},{"stem":"Explain your thinking · Subtract each reading from the next. Identify a pattern in the differences and extend it rather than extrapolating from only two points.\nNow check this example: A container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?","options":["71°","72°","68°","70°"],"answer":1,"solution":"Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°."}],"QR-12":[{"stem":"Skill builder · Input-output functions\nA table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?","options":["multiply by 3","add 8","add 6","multiply by 2 then add 5"],"answer":1,"solution":"Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8."},{"stem":"Spot the mistake · A student chose “multiply by 3.” What should the answer be instead?\nA table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?","options":["multiply by 3","add 6","add 8","multiply by 2 then add 5"],"answer":2,"solution":"Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?","options":["multiply by 2 then add 5","add 8","multiply by 3","add 6"],"answer":1,"solution":"Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8."}],"QR-13":[{"stem":"Skill builder · Symbolic square perimeter\nA square has perimeter 12t. Which expression gives one side?","options":["3t","4t","6t","12t"],"answer":0,"solution":"All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t."},{"stem":"Spot the mistake · A student chose “4t.” What should the answer be instead?\nA square has perimeter 12t. Which expression gives one side?","options":["4t","6t","3t","12t"],"answer":2,"solution":"All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A square has perimeter 12t. Which expression gives one side?","options":["12t","3t","4t","6t"],"answer":1,"solution":"All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t."}],"QR-14":[{"stem":"Skill builder · Solving linear equations\nWhich value of x satisfies 22 = 4x + 6?","options":["2","3","4","7"],"answer":2,"solution":"Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22."},{"stem":"Spot the mistake · A student chose “2.” What should the answer be instead?\nWhich value of x satisfies 22 = 4x + 6?","options":["2","3","4","7"],"answer":2,"solution":"Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Which value of x satisfies 22 = 4x + 6?","options":["7","4","2","3"],"answer":1,"solution":"Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22."}],"QR-15":[{"stem":"Skill builder · Growing geometric patterns\nA triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?","options":["11","13","14","15"],"answer":1,"solution":"The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13."},{"stem":"Spot the mistake · A student chose “11.” What should the answer be instead?\nA triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?","options":["11","14","13","15"],"answer":2,"solution":"The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?","options":["15","13","11","14"],"answer":1,"solution":"The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13."}],"QR-16":[{"stem":"Skill builder · Odd-number sum patterns\nWhat is 1 + 3 + 5 + 7 + 9 + 11 + 13?","options":["36","42","49","56"],"answer":2,"solution":"The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49."},{"stem":"Spot the mistake · A student chose “36.” What should the answer be instead?\nWhat is 1 + 3 + 5 + 7 + 9 + 11 + 13?","options":["36","42","49","56"],"answer":2,"solution":"The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: What is 1 + 3 + 5 + 7 + 9 + 11 + 13?","options":["56","49","36","42"],"answer":1,"solution":"The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49."}],"QR-17":[{"stem":"Skill builder · Convert an angle to a fraction\nA circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?","options":["1/8","1/4","1/3","1/2"],"answer":1,"solution":"A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses."},{"stem":"Spot the mistake · A student chose “1/8.” What should the answer be instead?\nA circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?","options":["1/8","1/3","1/4","1/2"],"answer":2,"solution":"A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses."},{"stem":"Explain your thinking · A full circle is 360°. A sector’s fraction is sector angle ÷ 360°.\nNow check this example: A circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?","options":["1/2","1/4","1/8","1/3"],"answer":1,"solution":"A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses."}],"QR-18":[{"stem":"Skill builder · Mean with mixed numbers\nFour parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?","options":["2 lb","3 lb","3.5 lb","4 lb"],"answer":1,"solution":"Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb."},{"stem":"Spot the mistake · A student chose “2 lb.” What should the answer be instead?\nFour parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?","options":["2 lb","3.5 lb","3 lb","4 lb"],"answer":2,"solution":"Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Four parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?","options":["4 lb","3 lb","2 lb","3.5 lb"],"answer":1,"solution":"Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb."}],"QR-19":[{"stem":"Skill builder · Decimal number lines\nA number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?","options":["1.3","1.5","1.6","1.8"],"answer":2,"solution":"Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6."},{"stem":"Spot the mistake · A student chose “1.3.” What should the answer be instead?\nA number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?","options":["1.3","1.5","1.6","1.8"],"answer":2,"solution":"Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?","options":["1.8","1.6","1.3","1.5"],"answer":1,"solution":"Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6."}],"QR-20":[{"stem":"Skill builder · Segment subtraction\nPoints A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?","options":["m + n","m − n","n − m","mn"],"answer":1,"solution":"The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n."},{"stem":"Spot the mistake · A student chose “m + n.” What should the answer be instead?\nPoints A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?","options":["m + n","n − m","m − n","mn"],"answer":2,"solution":"The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Points A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?","options":["mn","m − n","m + n","n − m"],"answer":1,"solution":"The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n."}],"QR-21":[{"stem":"Skill builder · Estimating products\nWhich product best estimates 592 × 47?","options":["60 × 50","600 × 5","600 × 50","500 × 40"],"answer":2,"solution":"Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate."},{"stem":"Spot the mistake · A student chose “60 × 50.” What should the answer be instead?\nWhich product best estimates 592 × 47?","options":["60 × 50","600 × 5","600 × 50","500 × 40"],"answer":2,"solution":"Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Which product best estimates 592 × 47?","options":["500 × 40","600 × 50","60 × 50","600 × 5"],"answer":1,"solution":"Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate."}],"QR-22":[{"stem":"Skill builder · Cube volume\nA cube has edge length 4 units. What is its volume?","options":["12 cubic units","16 cubic units","48 cubic units","64 cubic units"],"answer":3,"solution":"Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units."},{"stem":"Spot the mistake · A student chose “12 cubic units.” What should the answer be instead?\nA cube has edge length 4 units. What is its volume?","options":["12 cubic units","16 cubic units","64 cubic units","48 cubic units"],"answer":2,"solution":"Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A cube has edge length 4 units. What is its volume?","options":["48 cubic units","64 cubic units","12 cubic units","16 cubic units"],"answer":1,"solution":"Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units."}],"QR-23":[{"stem":"Skill builder · Combining container volumes\nOne measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?","options":["1/4 cup","1 cup","1 1/4 cups","2 cups"],"answer":2,"solution":"Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups."},{"stem":"Spot the mistake · A student chose “1/4 cup.” What should the answer be instead?\nOne measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?","options":["1/4 cup","1 cup","1 1/4 cups","2 cups"],"answer":2,"solution":"Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: One measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?","options":["2 cups","1 1/4 cups","1/4 cup","1 cup"],"answer":1,"solution":"Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups."}],"QR-24":[{"stem":"Skill builder · Symmetry and folds\nA figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?","options":["horizontal only","vertical only","both","neither"],"answer":1,"solution":"A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold."},{"stem":"Spot the mistake · A student chose “horizontal only.” What should the answer be instead?\nA figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?","options":["horizontal only","both","vertical only","neither"],"answer":2,"solution":"A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?","options":["neither","vertical only","horizontal only","both"],"answer":1,"solution":"A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold."}],"QR-25":[{"stem":"Skill builder · Equal sharing and estimation\nA snack mix contains 8 cups cereal, 6 cups pretzels, 3 cups fruit, and 2 cups seeds. It is divided equally into 4 bags. Approximately how many cups per bag?","options":["2 cups","4 cups","5 cups","8 cups"],"answer":2,"solution":"Total = 8 + 6 + 3 + 2 = 19 cups. 19 ÷ 4 = 4.75 cups, approximately 5."},{"stem":"Spot the mistake · A student chose “2 cups.” What should the answer be instead?\nA snack mix contains 8 cups cereal, 6 cups pretzels, 3 cups fruit, and 2 cups seeds. It is divided equally into 4 bags. Approximately how many cups per bag?","options":["2 cups","4 cups","5 cups","8 cups"],"answer":2,"solution":"Total = 8 + 6 + 3 + 2 = 19 cups. 19 ÷ 4 = 4.75 cups, approximately 5."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: A snack mix contains 8 cups cereal, 6 cups pretzels, 3 cups fruit, and 2 cups seeds. It is divided equally into 4 bags. Approximately how many cups per bag?","options":["8 cups","5 cups","2 cups","4 cups"],"answer":1,"solution":"Total = 8 + 6 + 3 + 2 = 19 cups. 19 ÷ 4 = 4.75 cups, approximately 5."}],"QR-26":[{"stem":"Skill builder · Scale drawings\nOn a map, 1.5 inches represents 12 miles. How many inches represent 32 miles?","options":["2.5","3","4","6"],"answer":2,"solution":"Scale factor: 32 ÷ 12 = 8/3. Multiply 1.5 × 8/3 = 4 inches."},{"stem":"Spot the mistake · A student chose “2.5.” What should the answer be instead?\nOn a map, 1.5 inches represents 12 miles. How many inches represent 32 miles?","options":["2.5","3","4","6"],"answer":2,"solution":"Scale factor: 32 ÷ 12 = 8/3. Multiply 1.5 × 8/3 = 4 inches."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: On a map, 1.5 inches represents 12 miles. How many inches represent 32 miles?","options":["6","4","2.5","3"],"answer":1,"solution":"Scale factor: 32 ÷ 12 = 8/3. Multiply 1.5 × 8/3 = 4 inches."}],"QR-27":[{"stem":"Skill builder · Translate the proportion\nIn a class, the probability of selecting a student who rides the bus is 2/5. If 18 students do not ride the bus, how many do?","options":["8","10","12","15"],"answer":2,"solution":"Non-bus students represent 3/5. If 3 parts = 18, one part = 6. Bus riders are 2 parts = 12."},{"stem":"Spot the mistake · A student chose “8.” What should the answer be instead?\nIn a class, the probability of selecting a student who rides the bus is 2/5. If 18 students do not ride the bus, how many do?","options":["8","10","12","15"],"answer":2,"solution":"Non-bus students represent 3/5. If 3 parts = 18, one part = 6. Bus riders are 2 parts = 12."},{"stem":"Explain your thinking · Use probability as part/whole. Convert the known complement into fractional parts of the whole.\nNow check this example: In a class, the probability of selecting a student who rides the bus is 2/5. If 18 studen  20. Range = 14; median = 21."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Four students read 12, 18, 24, and 26 minutes. Which statement is true?","options":["all times are even multiples of 6","mean is 20 minutes","range is 20 minutes","median is 24 minutes"],"answer":1,"solution":"Mean = (12 + 18 + 24 + 26) ÷ 4 = 80 ÷ 4 = 20. Range = 14; median = 21."}],"QR-30":[{"stem":"Skill builder · Translating verbal equations\nWhich equation represents “three less than five times a number equals eight more than the number”?","options":["5n − 3 = n + 8","3 − 5n = n + 8","5(n − 3) = 8n","5n + 3 = n − 8"],"answer":0,"solution":"Five times a number is 5n. Three less is 5n − 3. Eight more than the number is n + 8."},{"stem":"Spot the mistake · A student chose “3 − 5n = n + 8.” What should the answer be instead?\nWhich equation represents “three less than five times a number equals eight more than the number”?","options":["3 − 5n = n + 8","5(n − 3) = 8n","5n − 3 = n + 8","5n + 3 = n − 8"],"answer":2,"solution":"Five times a number is 5n. Three less is 5n − 3. Eight more than the number is n + 8."},{"stem":"Explain your thinking · Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.\nNow check this example: Which equation represents “three less than five times a number equals eight more than the number”?","options":["5n + 3 = n − 8","5n − 3 = n + 8","3 − 5n = n + 8","5(n − 3) = 8n"],"answer":1,"solution":"Five times a number is 5n. Three less is 5n − 3. Eight more than the number is n + 8."}],"QR-31":[{"stem":"Skill builder · Polygon triangulation\nHow many triangles result when a convex 8-sided polygon is divided by diagonals drawn from one vertex to a function test(){let a=testQs(section,mode),q=a[index],ans=result(q,mode),s=score(section,mode),label=mode==='diag'?'Diagnostic':'Mastery check';return `<div class="row"><h2>${label} • ${section==='QR'?'Quantitative Reasoning':'Mathematics Achievement'}</h2><span class="pill">Question ${index+1} of ${a.length}</span></div>${bar(s.answered,s.total)}<p class="muted mini">${s.answered} answered • ${section==='QR'?'34-minute ERB practice pacing':'25-minute ERB practice pacing'} • Work independently; explanations are hidden during testing.</p>${card(`<div class="row"><span class="pill">${esc(q.skill)}</span><span class="tag">Aligned to ERB ${section} #${q.ref} • PDF p. ${q.pdfpage}</span></div><div class="question">${esc(q.stem)}</div>${diagram(q)}${mode==='diag'?`<div class="actions">${button(state.hints[q.id]?'Hint viewed — no mastery credit':'Show hint (forfeits mastery credit)','revealHint()','secondary')}</div>${state.hints[q.id]?`<div class="notice"><strong>Hint used:</strong> ${esc(hintText(q))}<p>Correct answers after a hint are recorded, but do not earn diagnostic mastery credit.</p></div>`:''}`:''}${q.options.map((o,i)=>`<button class="choice ${ans===i?'selected':''}" onclick="choose(${i})"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}<div class="actions">${button('Previous',"step(-1)",'secondary')}${button('Next',"step(1)")}${button('Section results',"setPage('results')",'ghost')}</div>`)}<p class="muted mini">Your answers are saved in this browser. Return to unanswered items before submitting your practice session.</p>`}
function step(n){index=Math.max(0,Math.min(testQs(section,mode).length-1,index+n));render();window.scrollTo(0,0)}
function practice(){let sectionItems=qs(section),missed=sectionItems.filter(q=>!mastered(q)),all=sectionItems.filter(q=>result(q,'diag')!==undefined),pool=filter==='missed'?missed:filter==='all'?sectionItems:all;if(!practiceId||!pool.some(q=>q.id===practiceId))practiceId=pool[0]?.id;let q=byId(practiceId);return `<h2>${section==='QR'?'Quantitative Reasoning':'Mathematics Achievement'} · Mini-lessons & guided practice</h2><div class="card"><div class="row"><p class="muted">${missed.length} units still to master in this section • Choose a question below. Missed items appear first.</p><select onchange="filter=this.value;practiceId=null;render()"><option value="all" ${filter==='all'?'selected':''}>All skills in this section</option><option value="missed" ${filter==='missed'?'selected':''}>Missed only</option><option value="attempted" ${filter==='attempted'?'selected':''}>Attempted only</option></select></div><select style="width:100%" onchange="practiceId=this.value;render()">${[...pool].sort((a,b)=>(status(a)==='Needs review'?-1:1)-(status(b)==='Needs review'?-1:1)).map(x=>`<option value="${x.id}" ${practiceId===x.id?'selected':''}>${x.id} • ${esc(x.skill)} • ${status(x)}</option>`).join('')}</select></div>${q?practiceCard(q):card('No questions in this filter yet. Complete a diagnostic first.')}`}
let practiceStep=0;
function setPracticeStep(n){practiceStep=Math.max(0,Math.min(4,n));render();}
function practiceCard(q){let d=result(q,'diag'),p=result(q,'practice'),steps=['1 · Learn','2 · See example','3 · Try it','4 · Challenges','5 · Reflect'];let head=`<div class="row"><div><span class="pill">${q.section} · Question ${q.ref}</span><h3>${esc(q.skill)}</h3></div><span class="pill">${mastered(q)?'✓ Mastered':'Keep practicing'}</span></div><div class="practice-steps">${steps.map((x,i)=>`<button class="${practiceStep===i?'active':''}" onclick="setPracticeStep(${i})">${x}</button>`).join('')}</div>`;
let content='';
if(practiceStep===0)content=`<div class="kid-instruction"><strong>Today's goal:</strong> ${esc(q.lessonTitle)}. Read the short lesson, then go to the example.</div><h3>What you need to know</h3><div class="notice">${esc(q.lesson)}</div><p>Take your time. You can return to this lesson whenever you need help.</p>`;
if(practiceStep===1)content=`<div class="kid-instruction"><strong>Watch how it works.</strong> Think about your first step before opening the solution.</div><div class="question">${esc(q.stem)}</div>${diagram(q)}<details ${d!==undefined&&!diagCredit(q)?'open':''}><summary>Tap to see the step-by-step solution</summary><div class="worked"><strong>Answer: ${'ABCD'[q.answer]} — ${esc(q.options[q.answer])}</strong><p>${esc(q.solution)}</p><p><strong>Check your work:</strong> Does your answer make sense?</p></div></details>`;
if(practiceStep===2)content=`<div class="kid-instruction"><strong>Your turn!</strong> Choose an answer. You can try again if you make a mistake.</div><div class="question">${esc(q.stem)}</div>${diagram(q)}${q.options.map((o,i)=>`<button class="choice ${p===i?(p===q.answer?'correct':'wrong'):''}" onclick="state.practice['${q.id}']=${i};save();render()"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${p!==undefined?`<div class="${p===q.answer?'worked':'notice'}"><strong>${p===q.answer?'Great work!':'Not quite. Try again!'}</strong><p>${esc(q.solution)}</p></div>`:''}`;
if(practiceStep===3)content=`<div class="kid-instruction"><strong>Three skill challenges.</strong> Answer each card. If you get stuck, go back to the lesson or example.</div>${EXTRAS[q.id].map((e,j)=>`<div class="challenge"><div class="row"><h4>Challenge ${j+1} of 3</h4><span class="pill">${state.extra[q.id+'-'+j]===e.answer?'✓ Correct':'Not complete'}</span></div><p style="white-space:pre-line">${esc(e.stem)}</p>${e.options.map((o,k)=>`<button class="choice ${state.extra[q.id+'-'+j]===k?(k===e.answer?'correct':'wrong'):''}" onclick="state.extra['${q.id}-'+${j}]=${k};save();render()"><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}${state.extra[q.id+'-'+j]!==undefined?`<div class="${state.extra[q.id+'-'+j]===e.answer?'worked':'notice'}">${state.extra[q.id+'-'+j]===e.answer?'You got it!':'Try a different answer.'} ${esc(e.solution)}</div>`:''}</div>`).join('')}<p class="muted mini">These challenges practice the same example in different ways. They do not replace three new, independent problems.</p>`;
if(practiceStep===4)content=`<div class="kid-instruction"><strong>Check in with yourself.</strong> Can you explain how to solve this type of problem?</div><p><strong>Diagnostic result:</strong> ${status(q)}</p><p><strong>Practice challenges:</strong> ${[0,1,2].filter(j=>state.extra[q.id+'-'+j]===EXTRAS[q.id][j].answer).length} of 3 correct</p><p><strong>Unit status:</strong> ${mastered(q)?'✓ Mastered':'Keep working — you can do it!'}</p><label><input type="checkbox" ${state.flags[q.id]?'checked':''} onchange="state.flags['${q.id}']=this.checked;save()"> I can explain my steps in my own words.</label>`;
return card(`<div class="practice-card">${head}${content}<div class="practice-nav">${button('← Back',`setPracticeStep(${practiceStep-1})`,'secondary')}${button(practiceStep===4?'Next question →':'Continue →',practiceStep===4?'nextPractice()':`setPracticeStep(${practiceStep+1})`)}</div></div>`)}
function nextPractice(){let pool=filter==='missed'?qs(section).filter(q=>status(q)==='Needs review'):filter==='attempted'?qs(section).filter(q=>result(q,'diag')!==undefined):qs(section);let i=pool.findIndex(q=>q.id===practiceId);practiceId=pool[(i+1)%pool.length]?.id;practiceStep=0;render();window.scrollTo(0,0)}
function results(){let a=score('QR','diag'),b=score('MA','diag'),c=score('QR','mastery'),d=score('MA','mastery');return `<h2>Results & diagnostic error analysis</h2><p><strong>Units mastered:</strong> ${ITEMS.filter(mastered).length}/60 • <strong>Final assessment:</strong> ${unlocked()?'Unlocked':'Locked'} • <strong>Correct with hint:</strong> ${ITEMS.filter(q=>state.hints[q.id]&&result(q,'diag')===q.answer).length}</p><div class="grid">${[['QR diagnostic',a],['MA diagnostic',b],['QR mastery check',c],['MA mastery check',d]].map(([n,s])=>card(`<h3>${n}</h3><div class="metric">${s.correct}/${s.total}</div><p class="muted">${s.answered} attempted • ${s.answered?Math.round(100*s.correct/s.answered):0}% of attempted correct</p>${bar(s.correct,s.total)}`)).join('')}</div><div class="card"><h3>Item-by-item alignment and remediation</h3><p class="muted mini">Every row is linked to the corresponding numbered question in the uploaded ERB test. Incorrect diagnostic answers receive a complete worked correction in Practice.</p><div style="overflow:auto"><table><thead><tr><th>ERB ref</th><th>Skill</th><th>Diagnostic</th><th>Practice</th><th>Mastery</th><th>Correction</th></tr></thead><tbody>${ITEMS.map(q=>`<tr><td>${q.id}</td><td>${esc(q.skill)}</td><td>${status(q)}</td><td>${result(q,'practice')===undefined?'—':result(q,'practice')===q.answer?'Correct':'Retry'}</td><td>${result(q,'mastery')===undefined?'—':result(q,'mastery')===q.answer?'Correct':'Incorrect'}</td><td><button class="btn secondary" onclick="practiceId='${q.id}';filter='all';setPage('practice')">Open lesson</button></td></tr>`).join('')}</tbody></table></div></div><div class="actions">${button('Export progress',"exportProgress()")}${button('Print results',"window.print()",'secondary')}</div>`}
const TOOL_CARDS=[
['Geometry','Rectangle area','A = ℓ × w','Multiply length by width; use square units.'],
['Geometry','Rectangle perimeter','P = 2ℓ + 2w','Add all four sides; use linear units.'],
['Geometry','Square area','A = s²','Multiply side length by itself.'],
['Geometry','Square perimeter','P = 4s','Four equal sides.'],
['Geometry','Triangle area','A = ½bh','Multiply base by perpendicular height, then divide by 2.'],
['Geometry','Triangle perimeter','P = a + b + c','Add the three side lengths.'],
['Geometry','Rectangular prism volume','V = ℓ × w × h','Use cubic units.'],
['Geometry','Cube volume','V = s³','Multiply the edge length three times.'],
['Geometry','Circle circumference','C = 2πr = πd','r is radius; d is diameter.'],
['Geometry','Circle area','A = πr²','Square the radius before multiplying by π.'],
['Geometry','Angle relationships','Complementary = 90°; supplementary = 180°','Triangle interior angles total 180°; quadrilateral angles total 360°.'],
['Ratios & Rates','Unit rate','Unit rate = quantity ÷ number of units','For example, 120 miles ÷ 3 hours = 40 mph.'],
['Ratios & Rates','Proportions','a/b = c/d ⇒ ad = bc','Cross-products are equal when denominators are nonzero.'],
['Ratios & Rates','Speed','Speed = distance ÷ time','Rearrange: distance = speed × time.'],
['Ratios & Rates','Percent of a number','Part = (percent ÷ 100) × whole','25% of 80 = 0.25 × 80 = 20.'],
['Ratios & Rates','Percent change','Change % = (change ÷ original) × 100','Use the original amount as the denominator.'],
['Data & Probability','Mean','Mean = sum of values ÷ number of values','Add all observations and divide by the count.'],
['Data & Probability','Median','Median = middle value after sorting','For an even count, average the two middle values.'],
['Data & Probability','Mode','Mode = most frequent value','A data set may have more than one mode or no mode.'],
['Data & Probability','Range','Range = maximum − minimum','Measures the span of the data.'],
['Data & Probability','Probability','P(event) = favorable ÷ total outcomes','For equally likely outcomes only.'],
['Data & Probability','Circle graph','Sector fraction = angle ÷ 360°','Multiply the fraction by the total to estimate a category count.'],
['Numbers & Algebra','Order of operations','Grouping → exponents → ×/÷ → +/−','At the same priority, work left to right.'],
['Numbers & Algebra','Fraction addition','a/b + c/d = (ad + bc)/bd','Find a common denominator; simplify afterward.'],
['Numbers & Algebra','Fraction multiplication','(a/b)(c/d) = ac/bd','Multiply numerators and denominators.'],
['Numbers & Algebra','Fraction division','(a/b) ÷ (c/d) = (a/b)(d/c)','Multiply by the reciprocal of the divisor.'],
['Numbers & Algebra','Distributive property','a(b + c) = ab + ac','Multiply each term inside the parentheses.'],
['Numbers & Algebra','Distance on a number line','Distance = |a − b|','Absolute value makes distance nonnegative.']
];
const TOOL_DEFS={
'Symbols & Vocabulary':[['Variable (x, n, p, q)','A letter standing for a number that can vary.'],['ℓ, w, h, s','Length, width, height, and side length.'],['A, P, V, C','Area, perimeter, volume, and circumference. P(event) denotes probability.'],['r, d, π','Radius, diameter, and pi (approximately 3.14).'],['=, ≠, ≈','Equal, not equal, and approximately equal.'],['>, <, ≥, ≤','Greater than, less than, at least, and at most.'],['∩','Intersection: values or objects belonging to both sets.'],['(x, y)','An ordered pair: horizontal coordinate first, vertical second.'],['Factor and multiple','A factor divides a number exactly; a multiple is a product of that number and an integer.'],['Prime number','A whole number greater than 1 with exactly two positive factors.'],['Numerator / denominator','The top / bottom of a fraction; denominator indicates equal parts of the whole.'],['Equivalent fractions','Fractions representing the same value.']],
'Strategies':[['Read precisely','Underline the actual question; identify conditions such as NOT, BEST, and APPROXIMATELY.'],['Represent the situation','Sketch a diagram, make a table, write an equation, or use a number line.'],['Estimate first','Predict the approximate size of the answer to eliminate implausible choices.'],['Check units','Use consistent units; distinguish linear, square, and cubic units.'],['Use answer choices','Substitute choices when solving algebraically would take longer.'],['Visual reasoning','For grids, count equal areas; for Venn diagrams, interpret the overlap as AND.'],['Graph reading','Check labels, intervals, units, and scales before calculating.'],['Pacing','Skip a stubborn question and return later; answer every question because wrong answers carry no penalty.'],['Diagnostic hints','A correct response after viewing a hint is tracked as assisted, not mastered.']]
};
let toolTab='Flashcards',toolCategory='All',toolQuery='',toolFlipped={};
function setToolTab(t){toolTab=t;render()}
function flipToolCard(i){toolFlipped[i]=!toolFlipped[i];let el=document.getElementById('tool-card-'+i);if(el){el.classList.toggle('flipped',!!toolFlipped[i]);el.setAttribute('aria-label',toolFlipped[i]?'Answer shown. Activate to see formula.':'Formula shown. Activate to see explanation.');el.querySelector('.card-label').textContent=toolFlipped[i]?'EXPLANATION':'FORMULA';el.querySelector('.card-main').textContent=toolFlipped[i]?TOOL_CARDS[i][3]:TOOL_CARDS[i][2]}}
function library(){let cats=['All',...new Set(TOOL_CARDS.map(c=>c[0]))];let matches=TOOL_CARDS.map((c,i)=>({c,i})).filter(({c})=>(toolCategory==='All'||c[0]===toolCategory)&&c.join(' ').toLowerCase().includes(toolQuery.toLowerCase()));return `<div class="tool-header"><div><span class="pill">STUDY REFERENCE</span><h2 style="margin-top:9px">Math tools & formula flashcards</h2><p class="tool-intro">A clean, organized reference for Lower Level ISEE math. Tap a formula to reveal what it means and when to use it.</p></div><span class="pill">${TOOL_CARDS.length} formula cards</span></div><div class="tool-tabs">${['Flashcards','Symbols & Vocabulary','Strategies'].map(t=>`<button class="tool-tab ${toolTab===t?'active':''}" onclick="setToolTab('${t}')">${t}</button>`).join('')}</div>${toolTab==='Flashcards'?`<div class="card"><div class="row"><label><strong>Topic</strong> <select onchange="toolCategory=this.value;render()">${cats.map(c=>`<option ${c===toolCategory?'selected':''}>${c}</option>`).join('')}</select></label><label><strong>Search</strong> <input class="tool-search" placeholder="Find a formula or concept" value="${esc(toolQuery)}" oninput="toolQuery=this.value;render();document.querySelector('.tool-search')?.focus()"></label></div><p class="tool-tip">Showing ${matches.length} cards. Each card flips independently; use Tab and Enter for keyboard access.</p></div><div class="tool-grid">${matches.map(({c,i})=>`<button type="button" id="tool-card-${i}" class="flashcard ${toolFlipped[i]?'flipped':''}" onclick="flipToolCard(${i})" aria-label="${toolFlipped[i]?'Answer shown. Activate to see formula.':'Formula shown. Activate to see explanation.'}"><span class="card-label">${toolFlipped[i]?'EXPLANATION':'FORMULA'}</span><span class="front">${esc(c[1])}</span><span class="card-main ${toolFlipped[i]?'back':'front'}">${esc(toolFlipped[i]?c[3]:c[2])}</span><span class="tool-tip">${esc(c[0])} · Tap to flip</span></button>`).join('')||'<p>No matching formulas. Try another search.</p>'}</div>`:`<div class="tool-grid">${TOOL_DEFS[toolTab].map(([term,desc])=>`<section class="tool-panel"><h3>${esc(term)}</h3><p>${esc(desc)}</p></section>`).join('')}</div>`}<div class="card" style="margin-top:20px"><h3>About this reference</h3><p class="muted mini">These are study aids for the math topics represented in the attached 2016 ERB Lower Level ISEE practice test. The reference includes some useful extension formulas; not every formula appears on that specific test. This is an independent preparation resource, not an official ERB formula sheet.</p></div>`}
function settings(){return card(`<h2>Data & settings</h2><p>Progress is stored in this browser. Export a JSON backup to transfer between devices, then import it on the destination device. Import replaces the current browser's progress.</p><div class="actions">${button('Export progress JSON',"exportProgress()")} <label class="btn secondary" style="display:inline-block;cursor:pointer">Import progress JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></label>${button('Reset progress',"resetProgress()",'secondary')}</div><p class="muted mini">There is no server synchronization, student login, or teacher dashboard in this standalone version.</p>`)}
function exportProgress(){let data=JSON.stringify({exportedAt:new Date().toISOString(),progress:state},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='isee-math-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(el){let file=el.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text()),v=data.progress??data;if(!v||typeof v!=='object'||!['diag','practice','mastery'].every(k=>v[k]&&typeof v[k]==='object'&&!Array.isArray(v[k])))throw Error('Invalid progress structure');if(!confirm('Replace progress in this browser with the imported file?'))return;state={diag:v.diag,practice:v.practice,mastery:v.mastery,flags:v.flags??{},hints:v.hints??{},extra:v.extra??{}};save();render();alert('Progress imported successfully.')}catch(e){alert('Import failed: '+e.message)}finally{el.value=''}}
function resetProgress(){if(confirm('Delete all locally saved ISEE Math progress?')){state={diag:{},practice:{},mastery:{},flags:{},hints:{},extra:{}};save();setPage('home')}}
const STAGES=[['QR','diag','QR Diagnostic'],['QR','practice','QR Practice'],['QR','mastery','QR Mastery Assessment'],['MA','diag','MA Diagnostic'],['MA','practice','MA Practice'],['MA','mastery','MA Mastery Assessment']];
function goStage(i){let [s,m]=STAGES[i];section=s;if(m==='practice'){practiceId=null;filter='all';setPage('practice')}else openTest(m,s)}
function stageStrip(){let current=page==='test'?STAGES.findIndex(x=>x[0]===section&&x[1]===mode):page==='practice'?STAGES.findIndex(x=>x[0]===section&&x[1]==='practice'):-1;return `<div class="pathway"><div class="pathway-label">YOUR SIX-STEP MATH PATHWAY <span>Complete QR, then MA</span></div><div class="pathway-steps">${STAGES.map(([s,m,name],i)=>{let done=m==='diag'?score(s,'diag').answered===qs(s).length:m==='practice'?unlocked(s):score(s,'mastery').answered===testQs(s,'mastery').length;let locked=m==='mastery'&&!unlocked(s);return `<button class="pathway-step ${current===i?'current':''} ${done?'done':''}" onclick="goStage(${i})" aria-current="${current===i?'step':'false'}"><span class="step-number">${done?'✓':i+1}</span><span>${name}</span>${locked?'<small>🔒 Locked</small>':done?'<small>Complete</small>':''}</button>`}).join('')}</div></div>`}
function stageFooter(){let i=page==='test'?STAGES.findIndex(x=>x[0]===section&&x[1]===mode):page==='practice'?STAGES.findIndex(x=>x[0]===section&&x[1]==='practice'):-1;if(i<0||i>=5)return '';return `<div class="card next-stage"><strong>Next step: ${STAGES[i+1][2]}</strong><p>Continue through the pathway when you are ready. Mastery assessments unlock when all units in that section are mastered.</p>${button('Continue to '+STAGES[i+1][2],`goStage(${i+1})`)}</div>`}
function render(){app.innerHTML=stageStrip()+(page==='home'?home():page==='test'?test():page==='practice'?practice():page==='results'?results():page==='library'?library():settings())+stageFooter()}
document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>setPage(x.dataset.nav));render();
</script></body></html>
