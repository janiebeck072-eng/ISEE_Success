  let b='';for(let i=-5;i<=5;i++){let x=280+i*30,y=125+i*20;b+=line(x,25,x,225,'#e1e8f2',1)+line(130,y,430,y,'#e1e8f2',1)}b+=line(130,125,430,125,'#243d63',2)+line(280,25,280,225,'#243d63',2)+txt(444,130,'x')+txt(291,20,'y');let x=id==='21-2'?2:-3,y=id==='21-2'?-5:4;let px=280+x*30,py=125-y*20;b+=`<circle cx="${px}" cy="${py}" r="7" fill="#d34d62"/>`+txt(px+(x<0?-38:35),py-12,`(${x}, ${y})`,15);return box(b,`Coordinate plane showing (${x}, ${y})`);
 }
 if(id==='21-1')return box(`<polygon points="120,195 430,195 285,65" fill="#e7efff" stroke="#315dd7" stroke-width="3"/>`+line(285,65,285,195,'#d34d62',2)+`<path d="M285 182 h13 v13" fill="none" stroke="#d34d62" stroke-width="2"/>`+txt(275,225,'base = 14 cm')+txt(329,137,'height = 5 cm',14),'Triangle with base 14 cm and perpendicular height 5 cm');
 if(id==='20-2')return box(`<polygon points="155,80 345,80 420,125 230,125" fill="#e7efff" stroke="#315dd7" stroke-width="2"/><polygon points="155,80 230,125 230,215 155,170" fill="#d5e2ff" stroke="#315dd7" stroke-width="2"/><polygon points="230,125 420,125 420,215 230,215" fill="#b9d0fa" stroke="#315dd7" stroke-width="2"/>`+line(155,170,345,170)+line(345,80,420,125)+line(345,80,345,170)+line(345,170,420,215)+txt(325,236,'4 cm × 4 cm × 4 cm'),'Cube with all three dimensions equal to 4 cm');
 if(id==='23-1')return box(`<polygon points="150,78 340,78 410,120 220,120" fill="#e7efff" stroke="#315dd7" stroke-width="2"/><polygon points="150,78 220,120 220,210 150,168" fill="#d5e2ff" stroke="#315dd7" stroke-width="2"/><polygon points="220,120 410,120 410,210 220,210" fill="#b9d0fa" stroke="#315dd7" stroke-width="2"/>`+txt(315,231,'4 cm')+txt(440,165,'5 cm')+txt(181,106,'3 cm',13),'Rectangular prism with dimensions 3 cm, 4 cm, and 5 cm');
 if(id==='19-2'||id==='22-1'){
 let d=id==='19-2'?10:14,r=id==='19-2'?5:7;return box(`<circle cx="280" cy="126" r="85" fill="#e7efff" stroke="#315dd7" stroke-width="3"/>`+line(195,126,365,126,'#d34d62',3)+`<circle cx="280" cy="126" r="4" fill="#233956"/>`+txt(280,114,`diameter = ${d} cm`)+txt(280,237,`radius = ${r} cm`),'Circle with a diameter across its center');
 }
 if(id==='20-1')return box(`<polygon points="110,195 450,195 260,53" fill="#e7efff" stroke="#315dd7" stroke-width="3"/>`+txt(151,180,'38°')+txt(408,180,'72°')+txt(267,85,'?'),'Triangle with two known angles of 38° and 72°');
 if(id==='25-2'||id==='28-3'){
 let coin=id==='28-3',a=coin?['H','T']:['1','2','3','4','5','6'],b=coin?['H','T']:['1','2','3','4','5','6'];let body=txt(280,24,coin?'Two coin flips: possible outcomes':'Two dice: ordered outcomes',17);let cell=coin?65:36,startX=coin?212:160,startY=coin?75:43;b.forEach((v,j)=>a.forEach((u,i)=>{let x=startX+i*cell,y=startY+j*(coin?65:30);body+=`<rect x="${x}" y="${y}" width="${cell-3}" height="${coin?59:27}" rx="3" fill="${(i+j)%2?'#e6efff':'#cbdcfb'}"/>`+txt(x+(cell-3)/2,y+(coin?36:19),coin?u+v:u+','+v,coin?17:12)}));return box(body,coin?'Outcome table: HH, HT, TH, TT':'6 by 6 outcome table representing 36 ordered pairs');

function part(q,r,k,type){let strategy=k==='a',opts=strategy?q.strategyOptions:q.options,correct=strategy?q.strategyAnswer:q.answer,prompt=strategy?q.strategyPrompt:q.prompt,ans=r[k],checked=type==='practice'&&r.checked;return card(`<div class="eyebrow">Part ${k.toUpperCase()} · ${strategy?'Choose your strategy':'Solve the problem'}</div><div class="question">${esc(prompt)}</div><div class="choices">${opts.map((v,i)=>`<button class="choice ${ans===i?'selected':''} ${checked&&i===correct?'correct':''} ${checked&&ans===i&&i!==correct?'wrong':''}" ${checked?'disabled':''} onclick="choose('${k}',${i})" aria-pressed="${ans===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div>`,'panel')}
function choose(k,i){let cur=page==='diagnostic'?state.current:session,r=cur.records[cur.index];if(r.checked)return;r[k]=i;if(page==='diagnostic')save();render()}
function moveQuestion(delta){let cur=page==='diagnostic'?state.current:session;cur.index=Math.max(0,Math.min(cur.records.length-1,cur.index+delta));if(page==='diagnostic')save();render();window.scrollTo(0,0)}
function finishDiagnostic(){let c=state.current;if(!c||c.records.some(r=>r.a===null||r.b===null)){alert('Please answer both parts of every question before submitting.');return}state.diagnostics.push({...c,finished:new Date().toISOString()});state.current=null;save();page='results';session=null;render();window.scrollTo(0,0)}
function practice(){if(session?.type==='practice')return questionScreen('practice');return header('Practice studio','Choose a skill','Two-part questions with immediate feedback and worked explanations.')+`<div class="card"><label for="practiceSkill"><strong>Skill to practice</strong></label><p><select id="practiceSkill" class="filter" style="width:100%">${DATA.skills.map(s=>`<option value="${s.id}">${esc(s.section)} · ${esc(s.name)}</option>`).join('')}</select></p><button class="btn" onclick="startPractice()">Start practice</button></div><div class="notice">Each skill has at least two original practice questions. Practice reuses the skill bank, so repeated attempts may contain familiar questions. The full diagnostic is the best comprehensive starting point.</div>`}
function startPractice(){let id=Number(document.getElementById('practiceSkill').value),ids=DATA.questions.filter(q=>q.skill===id).map(q=>q.id);session={type:'practice',index:0,skill:id,ids,records:ids.map(id=>({id,a:null,b:null,checked:false}))};render()}
function checkPractice(){let r=session.records[session.index];if(r.a===null||r.b===null)return;r.checked=true;render()}
function endPractice(){if(session){let records=session.records.filter(r=>r.checked);if(records.length){state.practice.push({skill:session.skill,date:new Date().toISOString(),records});save()}}session=null;render()}
function skillReport(run){if(!run)return [];return DATA.skills.map(s=>{let rs=run.records.filter(r=>DATA.questions.find(q=>q.id===r.id)?.skill===s.id),as=rs.filter(r=>r.a!==null&&r.a!==undefined),bs=rs.filter(r=>r.b!==null&&r.b!==undefined),a=as.filter(r=>r.a===DATA.questions.find(q=>q.id===r.id)?.strategyAnswer).length,b=bs.filter(r=>r.b===DATA.questions.find(q=>q.id===r.id)?.answer).length;return {s,a,b,n:rs.length,ap:pct(a,as.length),bp:pct(b,bs.length)}})}
function results(){let l=latest();if(!l)return header('Performance reports','Results dashboard','No diagnostic has been submitted yet.')+card('<p>Complete the diagnostic to see your strategy score, solution score, and a skill-by-skill breakdown.</p><button class="btn" onclick="nav(\'diagnostic\')">Go to diagnostic</button>');let r=skillReport(l),ac=r.reduce((a,x)=>a+x.a,0),bc=r.reduce((a,x)=>a+x.b,0),weak=r.filter(x=>x.ap<80||x.bp<80);return header('Performance reports','Your latest diagnostic',`Completed ${new Date(l.finished).toLocaleString()} · ${state.diagnostics.length} completed diagnostic(s)`)+`<div class="grid"><div class="card"><div class="metric">${pct(ac,65)}%</div><div class="metriclabel">Strategy accuracy · ${ac}/65</div></div><div class="card"><div class="metric">${pct(bc,65)}%</div><div class="metriclabel">Solution accuracy · ${bc}/65</div></div><div class="card"><div class="metric">${weak.length}</div><div class="metriclabel">Skills to revisit (below 80% in either part)</div></div></div><div class="panel">${card(`<h2>Skill-by-skill results</h2><p class="muted">Two or three questions per skill provide an initial signal, not a definitive mastery determination.</p>${r.map(x=>`<div class="skillrow"><div><strong>${esc(x.s.name)}</strong><span class="tiny muted">${esc(x.s.section)} · ${esc(x.s.area)}</span><div class="bar"><span style="width:${x.bp}%"></span></div></div><div style="text-align:right"><span class="pill ${x.ap===100&&x.bp===100?'good':x.ap<60||x.bp<60?'bad':'warn'}">A ${x.a}/${x.n} · B ${x.b}/${x.n}</span><div class="tiny muted">${x.ap}% strategy · ${x.bp}% solving</div></div></div>`).join('')}`)}</div><div class="panel">${card(`<h2>Review your responses</h2><div class="tablewrap"><table><thead><tr><th>Skill / problem</th><th>Part A</th><th>Part B</th><th>Worked explanation</th></tr></thead><tbody>${l.records.map(z=>{let q=DATA.questions.find(x=>x.id===z.id);return `<tr><td><strong>${esc(DATA.skills[q.skill].name)}</strong><div class="tiny">${esc(q.prompt)}</div></td><td>${z.a===q.strategyAnswer?'✓':'✗'} ${esc(q.strategyOptions[z.a])}</td><td>${z.b===q.answer?'✓':'✗'} ${esc(q.options[z.b])}</td><td>${esc(q.explanation)}<div class="tiny muted">Correct: ${esc(q.options[q.answer])}</div></td></tr>`}).join('')}</tbody></table></div>` )}</div><div class="actions no-print"><button class="btn" onclick="downloadReport()">Export results (CSV)</button><button class="btn secondary" onclick="window.print()">Print report</button><button class="btn ghost" onclick="startNewDiagnostic()">Start a new diagnostic</button></div>`}
function startNewDiagnostic(){if(!confirm('Start a new diagnostic? Your completed diagnostic history will be kept. Any unfinished diagnostic will be replaced.'))return;state.current=null;save();beginDiagnostic()}
function skills(){let list=DATA.skills.filter(s=>skillFilter==='all'||s.section===skillFilter);return header('Skill reference','All 31 math skills','Aligned to the mathematics rows of Max’s skill tracker.')+`<div class="actions"><select class="filter" aria-label="Filter by section" onchange="skillFilter=this.value;render()"><option value="all" ${skillFilter==='all'?'selected':''}>All math skills</option>${['Quantitative Reasoning','Mathematics Achievement'].map(x=>`<option ${skillFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="panel">${card(list.map(s=>`<div class="skillrow"><div><strong>${esc(s.name)}</strong><div class="tiny muted">${esc(s.section)} · ${esc(s.area)} · Priority: ${esc(s.priority)}</div><p>${esc(s.objective)}</p></div><span class="pill">Baseline: ${esc(s.baseline)}</span></div>`).join(''))}</div>`}
function settings(){return header('Data management','Progress & settings','Progress is saved in this browser only. Export a backup to transfer devices or protect your work.')+card(`<label for="student">Student name</label><p><input id="student" class="filter" value="${esc(state.student)}" maxlength="60"></p><div class="actions"><button class="btn" onclick="state.student=document.getElementById('student').value.trim()||'Student';save();render()">Save name</button><button class="btn secondary" onclick="downloadJSON()">Export full progress (JSON)</button><label class="btn secondary" for="importFile" style="cursor:pointer">Import progress JSON</label><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importJSON(this)"><button class="btn danger" onclick="resetData()">Clear local progress</button></div><p class="tiny muted">Export includes question responses and diagnostic history. Import replaces existing local progress after confirmation. For school computers, check browser storage policies; private browsing may discard saved work.</p>`)}
function download(name,data,mime){let blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadJSON(){download('isee-math-progress-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'lower-isee-math-mastery-studio',version:1,exportedAt:new Date().toISOString(),state},null,2),'application/json')}
function importJSON(input){let f=input.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let v=JSON.parse(rd.result);if(v.format!=='lower-isee-math-mastery-studio'||!v.state||!Array.isArray(v.state.diagnostics)||!Array.isArray(v.state.practice))throw Error('Invalid progress format');if(!confirm('Replace current local progress with this imported file?'))return;state=v.state;session=null;save();nav('home')}catch(e){alert('Import failed: '+e.message)}};rd.readAsText(f)}
function resetData(){if(!confirm('Delete all saved progress on this browser? Export a backup first if needed.'))return;state=fresh();session=null;save();nav('home')}
function downloadReport(){let l=latest();if(!l)return;let lines=[['Skill','Section','Strategy correct','Strategy total','Solution correct','Solution total','Strategy %','Solution %']];for(let x of skillReport(l))lines.push([x.s.name,x.s.section,x.a,x.n,x.b,x.n,x.ap,x.bp]);let csv=lines.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');download('isee-math-skill-report.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));render();
</script></body></html>
