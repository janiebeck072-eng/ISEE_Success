<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lower ISEE Math Mastery Pathway</title><style>
:root{--navy:#102b4e;--blue:#3875bd;--light:#eaf3fb;--ink:#172b43;--muted:#5c6e80;--line:#d6e3ed;--good:#14734e;--bad:#aa3746}*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:var(--ink);font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{background:var(--navy);color:white;padding:19px max(20px,calc((100vw - 1120px)/2))}.top h1{margin:0;font-size:1.45rem}.top p{margin:0;color:#d3e8ff;font-size:.88rem}.nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.nav button{border:1px solid #7993ae;background:transparent;color:white;border-radius:8px;padding:8px 12px}.nav button.active{background:white;color:var(--navy)}main{max-width:1120px;margin:auto;padding:24px 16px 60px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:17px;box-shadow:0 5px 18px #142c4b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:var(--muted)}h2{margin:0 0 12px}h3{margin:12px 0 7px}.btn{border:0;border-radius:9px;padding:10px 16px;background:var(--blue);color:white;font-weight:650}.btn.secondary{background:var(--light);color:var(--navy)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.pill{display:inline-block;background:var(--light);color:var(--navy);padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700}.question{font-size:1.18rem;font-weight:700;margin:17px 0}.choice{display:flex;width:100%;gap:12px;text-align:left;padding:12px 15px;margin:8px 0;border-radius:10px;border:1.5px solid #cad9e8;background:white}.choice.selected{border-color:var(--blue);background:var(--light)}.choice.correct{border-color:var(--good);background:#e9f7ef}.choice.wrong{border-color:var(--bad);background:#fff0f0}.choice b{min-width:24px}.notice{border-left:4px solid var(--blue);background:#f0f6ff;padding:13px 16px;margin:13px 0;border-radius:6px}.worked{border-left:4px solid var(--good);background:#eef9f3;padding:14px 16px;margin:12px 0;border-radius:6px}.progress{height:10px;background:#e4ebf2;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.mini{font-size:.87rem}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.metric{font-size:2rem;font-weight:800}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}select{padding:8px;border:1px solid var(--line);border-radius:8px;max-width:100%}.diagram{background:#f7fbff;border:1px solid var(--line);padding:12px;border-radius:10px;margin:12px 0;overflow:auto}.diagram svg{max-width:100%;height:auto}details{margin:12px 0}summary{cursor:pointer;font-weight:700}.tag{font-size:.78rem;color:var(--muted)}@media print{.top,.actions,.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}} .challenge{border:1px solid #d3e1ef;border-radius:12px;padding:14px;margin:14px 0;background:#f8fbff}.challenge h4{margin:0 0 8px}.tool-header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.tool-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 20px}.tool-tab{border:1px solid var(--line);border-radius:24px;padding:9px 15px;background:white;color:var(--navy);font-weight:700}.tool-tab.active{background:var(--navy);color:white}.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.flashcard{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;border:2px solid #c9dded;border-radius:16px;background:linear-gradient(145deg,#fff,#eaf5ff);color:var(--navy);padding:24px;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:0 5px 16px #142c4b0a}.flashcard:hover{transform:translateY(-3px);border-color:var(--blue)}.flashcard:focus-visible{outline:3px solid #3875bd;outline-offset:3px}.flashcard.flipped{background:linear-gradient(145deg,#f1faf7,#fff);border-color:#70b49b}.flashcard .front{font-size:1.25rem;font-weight:800}.flashcard .back{font-size:1.08rem;font-weight:650}.flashcard .card-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.tool-panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:16px}.tool-panel h3{color:var(--navy);margin-top:0}.tool-definition{padding:12px 0;border-bottom:1px solid var(--line)}.tool-definition:last-child{border-bottom:0}.tool-definition strong{display:block;color:var(--navy)}.tool-search{padding:11px 14px;border:1px solid var(--line);border-radius:10px;width:min(100%,360px);font:inherit}.tool-intro{color:var(--muted);max-width:760px}.tool-tip{font-size:.84rem;color:var(--muted)}@media(max-width:600px){.tool-grid{grid-template-columns:1fr}.flashcard{min-height:160px}}.pathway{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:22px}.pathway-label{font-weight:800;color:var(--navy);font-size:.85rem;letter-spacing:.04em;display:flex;justify-content:space-between;gap:10px}.pathway-label span{font-weight:500;color:var(--muted)}.pathway-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}.pathway-step{border:1px solid #cddfeb;border-radius:11px;background:#f5f9fc;padding:10px 7px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;color:var(--navy);font-size:.78rem;font-weight:700;min-height:94px}.pathway-step.current{background:#d9eaf9;border:2px solid var(--blue)}.pathway-step.done{border-color:#82bda7}.pathway-step small{font-weight:500;color:var(--muted)}.step-number{display:grid;place-items:center;border-radius:50%;width:25px;height:25px;background:var(--navy);color:white}.next-stage{margin-top:20px}@media(max-width:760px){.pathway-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.pathway-label{flex-direction:column}}@media(max-width:440px){.pathway-steps{grid-template-columns:repeat(2,minmax(0,1fr))}} 
.practice-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}.practice-main{min-width:0}.practice-side{position:sticky;top:12px}.practice-side select{width:100%;font-size:15px}.practice-steps{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.practice-steps button{border:1px solid #c7d8e8;border-radius:999px;padding:9px 13px;background:#fff;color:var(--navy);font-weight:700}.practice-steps button.active{background:var(--navy);color:white}.kid-instruction{background:#eaf3fb;border-radius:12px;padding:14px 17px;margin:12px 0;font-size:1rem}.practice-card .choice{font-size:1rem;line-height:1.5;min-height:48px;align-items:center}.practice-card h3{font-size:1.18rem}.practice-card .question{line-height:1.65}.practice-nav{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.practice-side .btn{width:100%;margin-top:8px}.challenge{background:white;padding:18px}.challenge h4{font-size:1.05rem}.practice-status{font-size:.9rem;font-weight:700;color:var(--navy)}@media(max-width:850px){.practice-layout{grid-template-columns:1fr}.practice-side{position:static;order:-1}}

.tile-summary{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 18px}.tile-summary h2{margin:7px 0}.tile-summary p{margin:0;max-width:680px}.tile-count{background:#e5f1ff;border:1px solid #b7d7f1;border-radius:16px;padding:13px 22px;display:flex;flex-direction:column;text-align:center;color:var(--navy)}.tile-count strong{font-size:1.5rem}.tile-count span{font-size:.8rem}.tile-filter{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.tile-filter button{border:1px solid #bfd5e9;border-radius:100px;background:white;color:var(--navy);font-weight:750;padding:9px 16px}.tile-filter button.selected{background:var(--navy);color:white}.lesson-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}.lesson-tile{min-height:205px;display:flex;flex-direction:column;gap:10px;text-align:left;border:2px solid #c5ddf1;background:linear-gradient(155deg,#ffffff,#edf6ff);border-radius:18px;padding:17px;color:var(--ink);box-shadow:0 4px 12px #183e6110;transition:transform .12s,box-shadow .12s,border-color .12s}.lesson-tile:hover,.lesson-tile:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px #183e6122;border-color:#327ac0;outline-offset:3px}.lesson-tile.tile-started{background:linear-gradient(155deg,#fff,#fff4e7);border-color:#e8c998}.lesson-tile.tile-done{background:linear-gradient(155deg,#fff,#eaf9f1);border-color:#91cbb0}.tile-top,.tile-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.tile-number{display:grid;place-items:center;width:43px;height:43px;background:#286da8;color:#fff;border-radius:13px;font-weight:800;font-size:1.1rem}.tile-started .tile-number{background:#a56a21}.tile-done .tile-number{background:#16724c}.tile-symbol{font-size:1.5rem;color:#286da8}.tile-started .tile-symbol{color:#a56a21}.tile-done .tile-symbol{color:#16724c}.lesson-tile>strong{font-size:1.08rem;line-height:1.3}.tile-description{font-size:.88rem;color:#4f657b}.tile-bottom{margin-top:auto;border-top:1px solid #d5e2eb;padding-top:10px;font-size:.77rem;font-weight:750;color:var(--navy)}.lesson-return{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}@media(max-width:540px){.lesson-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lesson-tile{min-height:195px;padding:12px}.lesson-tile>strong{font-size:.94rem}.tile-bottom{font-size:.69rem;flex-wrap:wrap}.tile-count{padding:8px 14px}}

const ITEMS=[{"section": "QR", "ref": 1, "skill": "Fractional area models", "stem": "A triangular mosaic is partitioned into 8 equal-area triangular tiles. Exactly 3 are blue. What fraction is blue?", "options": ["3/8", "3/5", "5/8", "1/3"], "answer": 0, "solution": "The whole contains 8 equal-area tiles. Three are blue, so blue area ÷ total area = 3/8. Count equal areas, not merely visible shapes of different sizes.", "id": "QR-1", "lessonTitle": "Equal-area pieces", "lesson": "Count the equal-sized pieces representing the whole; count the selected pieces; write selected/total. If pieces differ in size, subdivide into equal areas.", "pdfpage": 12}, {"section": "QR", "ref": 2, "skill": "Multiplication situations", "stem": "Which situation is modeled by 8 × 6 = 48?", "options": ["48 stickers shared among 8 children", "8 packs with 6 stickers each", "8 stickers plus 6 stickers", "48 stickers with 6 removed"], "answer": 1, "solution": "Eight equal groups of six contain 8 × 6 = 48 stickers. Multiplication describes equal groups, not addition or subtraction.", "id": "QR-2", "lessonTitle": "Multiplication situations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 3, "skill": "Intersecting inequalities", "stem": "A whole number is greater than 11 and less than 15. It is also greater than 13 and less than 17. Which number is it?", "options": ["12", "13", "14", "16"], "answer": 2, "solution": "The first condition allows 12, 13, 14. The second allows 14, 15, 16. Their intersection is 14.", "id": "QR-3", "lessonTitle": "Intersecting inequalities", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 4, "skill": "Triangle perimeter", "stem": "A triangle has a perimeter of 37 cm. Two sides are 12 cm and 16 cm. How long is the third side?", "options": ["9 cm", "11 cm", "25 cm", "28 cm"], "answer": 0, "solution": "Perimeter adds all three sides. Missing side = 37 − 12 − 16 = 9 cm.", "id": "QR-4", "lessonTitle": "Triangle perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 5, "skill": "Two equations", "stem": "If 8 + a = 11 and 4 + b = 10, what is a + b?", "options": ["6", "7", "9", "13"], "answer": 2, "solution": "a = 11 − 8 = 3 and b = 10 − 4 = 6. Their sum is 3 + 6 = 9.", "id": "QR-5", "lessonTitle": "Two equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 12}, {"section": "QR", "ref": 6, "skill": "Spatial completion", "stem": "A 4-by-4 square grid has its entire top row and entire left column filled. How many additional unit squares are needed to complete the large square?", "options": ["7", "8", "9", "12"], "answer": 2, "solution": "A 4 × 4 square has 16 cells. The top row and left column occupy 4 + 4 − 1 = 7 distinct cells. Missing = 16 − 7 = 9.", "id": "QR-6", "lessonTitle": "Visualize the complete grid", "lesson": "Find total cells from rows × columns. Count filled cells carefully, avoiding double-counting overlapping rows and columns.", "pdfpage": 13}, {"section": "QR", "ref": 7, "skill": "Proportional travel", "stem": "A cyclist covers 6 miles in 18 minutes at a steady speed. How long will 15 miles take?", "options": ["30 minutes", "36 minutes", "45 minutes", "54 minutes"], "answer": 2, "solution": "Time per mile = 18 ÷ 6 = 3 minutes. For 15 miles, 15 × 3 = 45 minutes.", "id": "QR-7", "lessonTitle": "Proportional travel", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 8, "skill": "Comparing fractions", "stem": "Which fraction is greatest?", "options": ["4/7", "5/11", "6/13", "7/16"], "answer": 0, "solution": "Estimate or cross-multiply: 4/7 ≈ 0.571, 5/11 ≈ 0.455, 6/13 ≈ 0.462, 7/16 = 0.4375. The greatest is 4/7.", "id": "QR-8", "lessonTitle": "Comparing fractions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 9, "skill": "Divisibility", "stem": "A positive integer is divisible by both 4 and 7. It must also be divisible by which number?", "options": ["11", "14", "21", "28"], "answer": 3, "solution": "Because 4 and 7 have no common factor greater than 1, their least common multiple is 4 × 7 = 28.", "id": "QR-9", "lessonTitle": "Divisibility", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 13}, {"section": "QR", "ref": 10, "skill": "Venn diagram intersections", "stem": "One circle contains all striped figures; another contains all triangles. Which figure belongs in their overlap?", "options": ["striped square", "solid triangle", "striped triangle", "solid circle"], "answer": 2, "solution": "An intersection contains objects satisfying BOTH conditions. A striped triangle is simultaneously striped and triangular.", "id": "QR-10", "lessonTitle": "Both conditions must hold", "lesson": "The overlap of two circles represents the logical AND. Check every characteristic before selecting.", "pdfpage": 13}, {"section": "QR", "ref": 11, "skill": "Table pattern extrapolation", "stem": "A container's temperature is 42°, 46°, 51°, 57°, 64° at successive 10-minute checks. If the increases continue the same pattern, what is the next reading?", "options": ["68°", "70°", "71°", "72°"], "answer": 3, "solution": "Successive increases are +4, +5, +6, +7. The next increase is +8, giving 64 + 8 = 72°.", "id": "QR-11", "lessonTitle": "Analyze consecutive changes", "lesson": "Subtract each reading from the next. Identify a pattern in the differences and extend it rather than extrapolating from only two points.", "pdfpage": 14}, {"section": "QR", "ref": 12, "skill": "Input-output functions", "stem": "A table pairs 3→11, 8→16, and 14→22. Which rule matches every pair?", "options": ["multiply by 3", "add 8", "add 6", "multiply by 2 then add 5"], "answer": 1, "solution": "Subtract input from output: 11 − 3 = 8, 16 − 8 = 8, and 22 − 14 = 8. Rule: output = input + 8.", "id": "QR-12", "lessonTitle": "Input-output functions", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 13, "skill": "Symbolic square perimeter", "stem": "A square has perimeter 12t. Which expression gives one side?", "options": ["3t", "4t", "6t", "12t"], "answer": 0, "solution": "All four sides are equal. Side = perimeter ÷ 4 = 12t ÷ 4 = 3t.", "id": "QR-13", "lessonTitle": "Symbolic square perimeter", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 14, "skill": "Solving linear equations", "stem": "Which value of x satisfies 22 = 4x + 6?", "options": ["2", "3", "4", "7"], "answer": 2, "solution": "Subtract 6: 16 = 4x. Divide by 4: x = 4. Check: 4(4) + 6 = 22.", "id": "QR-14", "lessonTitle": "Solving linear equations", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 14}, {"section": "QR", "ref": 15, "skill": "Growing geometric patterns", "stem": "A triangle pattern has 1, 3, 5, 7 tiles in its first four rows. How many tiles are in row 7?", "options": ["11", "13", "14", "15"], "answer": 1, "solution": "The pattern increases by 2 tiles per row. Row 5 has 9, row 6 has 11, row 7 has 13.", "id": "QR-15", "lessonTitle": "Growing geometric patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 16, "skill": "Odd-number sum patterns", "stem": "What is 1 + 3 + 5 + 7 + 9 + 11 + 13?", "options": ["36", "42", "49", "56"], "answer": 2, "solution": "The sum of the first n odd numbers is n². There are 7 terms, so 7² = 49.", "id": "QR-16", "lessonTitle": "Odd-number sum patterns", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 17, "skill": "Circle graph fractions", "stem": "A circle graph shows a 90° sector for a favorite activity. What fraction of responses does the sector represent?", "options": ["1/8", "1/4", "1/3", "1/2"], "answer": 1, "solution": "A complete circle measures 360°. The sector represents 90/360 = 1/4 of the responses.", "id": "QR-17", "lessonTitle": "Convert an angle to a fraction", "lesson": "A full circle is 360°. A sector’s fraction is sector angle ÷ 360°.", "pdfpage": 15}, {"section": "QR", "ref": 18, "skill": "Mean with mixed numbers", "stem": "Four parcels weigh 2, 2, 3, and 5 pounds. What is their mean weight?", "options": ["2 lb", "3 lb", "3.5 lb", "4 lb"], "answer": 1, "solution": "Add the weights: 2 + 2 + 3 + 5 = 12. Divide by four parcels: 12 ÷ 4 = 3 lb.", "id": "QR-18", "lessonTitle": "Mean with mixed numbers", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 15}, {"section": "QR", "ref": 19, "skill": "Decimal number lines", "stem": "A number line from 1 to 2 is divided into 5 equal intervals. What number is at the third tick after 1?", "options": ["1.3", "1.5", "1.6", "1.8"], "answer": 2, "solution": "Each interval is (2 − 1) ÷ 5 = 0.2. The third tick is 1 + 3(0.2) = 1.6.", "id": "QR-19", "lessonTitle": "Decimal number lines", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 20, "skill": "Segment subtraction", "stem": "Points A, B, C occur in that order on a straight line. AC = m and AB = n. What is BC?", "options": ["m + n", "m − n", "n − m", "mn"], "answer": 1, "solution": "The whole segment AC consists of AB plus BC, so BC = AC − AB = m − n.", "id": "QR-20", "lessonTitle": "Segment subtraction", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 21, "skill": "Estimating products", "stem": "Which product best estimates 592 × 47?", "options": ["60 × 50", "600 × 5", "600 × 50", "500 × 40"], "answer": 2, "solution": "Round 592 to 600 and 47 to 50. Then 600 × 50 = 30,000, a sensible estimate.", "id": "QR-21", "lessonTitle": "Estimating products", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 22, "skill": "Cube volume", "stem": "A cube has edge length 4 units. What is its volume?", "options": ["12 cubic units", "16 cubic units", "48 cubic units", "64 cubic units"], "answer": 3, "solution": "Volume of a cube = side³. Compute 4 × 4 × 4 = 64 cubic units.", "id": "QR-22", "lessonTitle": "Cube volume", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 23, "skill": "Combining container volumes", "stem": "One measuring cup holds approximately 3/4 cup of liquid and another holds approximately 1/2 cup. How much liquid is there altogether?", "options": ["1/4 cup", "1 cup", "1 1/4 cups", "2 cups"], "answer": 2, "solution": "Convert 1/2 to 2/4. Add 3/4 + 2/4 = 5/4 = 1 1/4 cups.", "id": "QR-23", "lessonTitle": "Combining container volumes", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 16}, {"section": "QR", "ref": 24, "skill": "Symmetry and folds", "stem": "A figure is symmetric across a vertical line but not a horizontal line. Which fold would make its halves match?", "options": ["horizontal only", "vertical only", "both", "neither"], "answer": 1, "solution": "A line of symmetry is a fold where the halves coincide exactly. The vertical line is the only valid fold.", "id": "QR-24", "lessonTitle": "Symmetry and folds", "lesson": "Identify what the question is asking. Translate the quantities into an equation, table, diagram, or estimate. Work systematically, check units, and compare with all four answer choices.", "pdfpage": 17}, {"section": "QR", ility of a star?","options":["1/5","1/4","1/3","3/9"],"answer":1,"solution":"Three out of twelve is one fourth."},{"stem":"A box has 6 red, 2 green, and 4 blue counters. Probability of green?","options":["1/6","1/4","2/6","1/3"],"answer":0,"solution":"Two out of twelve is one sixth."},{"stem":"There are 5 triangles, 7 squares, and 8 circles. Probability of a square?","options":["7/13","5/20","8/20","7/20"],"answer":3,"solution":"Seven of twenty shapes are squares."}],"MA-16":[{"stem":"What is the mode of 4, 6, 4, 7, 8, 4, 6?","options":["4","5","6","1"],"answer":0,"solution":"Four appears most often."},{"stem":"Find the mode: 2.1, 2.3, 2.1, 2.5, 2.3, 2.3. ","options":["2.55","2.05","2.8","2.3"],"answer":3,"solution":"2.3 occurs three times."},{"stem":"What is the mode of 11, 12, 13, 11, 14, 11, 12?","options":["13","8","11","12"],"answer":2,"solution":"Eleven occurs most often."}],"MA-17":[{"stem":"Which of these is prime: 21, 29, 33, 39?","options":["29","33","39","21"],"answer":0,"solution":"29 has only factors one and itself."},{"stem":"Which number is prime: 35, 37, 49, 51?","options":["49","51","35","37"],"answer":3,"solution":"37 has no divisors besides one and itself."},{"stem":"Which is prime: 27, 31, 39, 45?","options":["45","27","31","39"],"answer":2,"solution":"31 is prime; the others have factors."}],"MA-18":[{"stem":"A rectangle has area 72 cm² and length 9 cm. Find width.","options":["10","5","8","9"],"answer":2,"solution":"Divide area by length."},{"stem":"A garden's area is 84 m² and its width is 7 m. Find length.","options":["8","12","13","14"],"answer":1,"solution":"84 divided by seven."},{"stem":"A rectangle has area 96 ft² and length 12 ft. Find width.","options":["8","9","10","5"],"answer":0,"solution":"96 divided by twelve."}],"MA-19":[{"stem":"Which fraction lies strictly between 1/4 and 1/2: 1/5, 3/8, 5/8, 3/4?","options":["3/4","1/5","3/8","5/8"],"answer":2,"solution":"Three eighths is 0.375."},{"stem":"Which fraction lies between 1/2 and 3/4: 2/5, 5/8, 4/5, 7/8?","options":["2/5","5/8","4/5","7/8"],"answer":1,"solution":"Five eighths is 0.625."},{"stem":"Which fraction lies between 2/3 and 1: 1/2, 3/5, 5/6, 7/6?","options":["3/5","5/6","7/6","1/2"],"answer":1,"solution":"Five sixths is between two thirds and one."}],"MA-20":[{"stem":"Find the next number: 2, 5, 10, 17, 26, __.","options":["37","41","44","26"],"answer":0,"solution":"Differences are 3,5,7,9; next is eleven."},{"stem":"What follows 4, 8, 14, 22, 32, __?","options":["48","53","31","44"],"answer":3,"solution":"Differences 4,6,8,10, then twelve."},{"stem":"Find the next term: 1, 4, 9, 16, 25, __.","options":["43","25","36","40"],"answer":2,"solution":"The terms are consecutive square numbers."}],"MA-21":[{"stem":"A flight departs at 10 A.M. and lasts 4 hours. Destination time is 3 hours ahead. Arrival local time?","options":["2 P.M.","3 P.M.","7 P.M.","5 P.M."],"answer":3,"solution":"10 A.M. plus four hours plus three hours."},{"stem":"A train departs at 1 P.M., travels 2 hours, and arrives in a time zone 1 hour behind. Local arrival time?","options":["3 P.M.","1 P.M.","2 P.M.","4 P.M."],"answer":2,"solution":"Three P.M. minus one hour."},{"stem":"A plane leaves at 8 A.M., flies 5 hours, and destination clocks are 2 hours ahead. Arrival local time?","options":["11 A.M.","3 P.M.","1 P.M.","5 P.M."],"answer":1,"solution":"Eight plus five plus two hours."}],"MA-22":[{"stem":"Find 2.4 + 3.9 and express as a mixed number.","options":["5 3/10","6 1/4","6 3/10","6 1/3"],"answer":2,"solution":"The sum is 6.3, or six and three tenths."},{"stem":"Add 4.75 and 1.5. Write the sum as a mixed number.","options":["6 1/2","6 1/4","6 3/4","5 1/4"],"answer":1,"solution":"6.25 equals six and one fourth."},{"stem":"Find 1.6 + 2.65 as a mixed number.","options":["4 1/4","3 1/4","4 3/4","4 1/2"],"answer":0,"solution":"4.25 equals four and one fourth."}],"MA-23":[{"stem":"A rectangle is 13 cm long and 8 cm wide. What is its perimeter?","options":["29","42","46"," nswer or all three new practice problems. <strong>5. Review:</strong> revisit the formula and strategy library.</p><p class="muted mini">For strongest validity, use the attached ERB practice test as a separate external benchmark after mastering this original question bank. The 68-question final reuses 60 diagnostic items and adds 8 new, more demanding items, so it is not a fully independent alternate form.</p></div>`}

let practiceStep=0;
function setPracticeStep(n){practiceStep=Math.max(0,Math.min(4,n));render();}
function practiceCard(q){let d=result(q,'diag'),p=result(q,'practice'),steps=['1 · Learn','2 · See example','3 · Try it','4 · Challenges','5 · Reflect'];let head=`<div class="row"><div><span class="pill">${q.section} · Question ${q.ref}</span><h3>${esc(q.skill)}</h3></div><span class="pill">${mastered(q)?'✓ Mastered':'Keep practicing'}</span></div><div class="practice-steps">${steps.map((x,i)=>`<button class="${practiceStep===i?'active':''}" onclick="setPracticeStep(${i})">${x}</button>`).join('')}</div>`;
let content='';
if(practiceStep===0)content=`<div class="kid-instruction"><strong>Today's goal:</strong> ${esc(q.lessonTitle)}. Read the short lesson, then go to the example.</div><h3>What you need to know</h3><div class="notice">${esc(q.lesson)}</div><p>Take your time. You can return to this lesson whenever you need help.</p>`;
if(practiceStep===1)content=`<div class="kid-instruction"><strong>Learn from the diagnostic.</strong> Study the original question and its worked solution before trying new problems.</div><div class="question">${esc(q.stem)}</div>${diagram(q)}<details ${d!==undefined&&!diagCredit(q)?'open':''}><summary>Tap to see the step-by-step solution</summary><div class="worked"><strong>Answer: ${'ABCD'[q.answer]} — ${esc(q.options[q.answer])}</strong><p>${esc(q.solution)}</p><p><strong>Check your work:</strong> Does your answer make sense?</p></div></details>`;
if(practiceStep===2)content=`<div class="kid-instruction"><strong>Review the diagnostic problem.</strong> Try the original question again, then move on to three NEW practice problems.</div><div class="question">${esc(q.stem)}</div>${diagram(q)}${q.options.map((o,i)=>`<button class="choice ${p===i?(p===q.answer?'correct':'wrong'):''}" onclick="state.practice['${q.id}']=${i};save();render()"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${p!==undefined?`<div class="${p===q.answer?'worked':'notice'}"><strong>${p===q.answer?'Great work!':'Not quite. Try again!'}</strong><p>${esc(q.solution)}</p></div>`:''}`;
if(practiceStep===3)content=`<div class="kid-instruction"><strong>Three NEW problems.</strong> Each question is different from the diagnostic. Solve one at a time. If you get stuck, return to the mini-lesson.</div>${EXTRAS[q.id].map((e,j)=>`<div class="challenge"><div class="row"><h4>Challenge ${j+1} of 3</h4><span class="pill">${state.extra[q.id+'-'+j]===e.answer?'✓ Correct':'Not complete'}</span></div><p style="white-space:pre-line">${esc(e.stem)}</p>${e.options.map((o,k)=>`<button class="choice ${state.extra[q.id+'-'+j]===k?(k===e.answer?'correct':'wrong'):''}" onclick="state.extra['${q.id}-'+${j}]=${k};save();render()"><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}${state.extra[q.id+'-'+j]!==undefined?`<div class="${state.extra[q.id+'-'+j]===e.answer?'worked':'notice'}">${state.extra[q.id+'-'+j]===e.answer?'You got it! '+esc(e.solution):'Not yet. Reread the question, check your calculations, and try another choice.'}</div>`:''}</div>`).join('')}<p class="muted mini">Each challenge is a new problem. Read carefully and solve it before checking your answer.</p>`;
if(practiceStep===4)content=`<div class="kid-instruction"><strong>Check in with yourself.</strong> Can you explain how to solve this type of problem?</div><p><strong>Diagnostic result:</strong> ${status(q)}</p><p><strong>Practice challenges:</strong> ${[0,1,2].filter(j=>state.extra[q.id+'-'+j]===EXTRAS[q.id][j].answer).length} of 3 correct</p><p><strong>Unit status:</strong> ${mastered(q)?'✓ Mastered':'Keep working — you can do it!'}</p><label><input type="checkbox" ${state.flags[q.id]?'checked':''} onchange="state.flags['${q.id}']=this.checked;save()"> I can explain my steps in my own words.</label>`;
return card(`<div class="practice-card">${head}${content}<div class="practice-nav">${button('← Back',`setPracticeStep(${practiceStep-1})`,'secondary')}${button(practiceStep===4?'Back to lesson tiles →':'Continue →',practiceStep===4?'nextPractice()':`setPracticeStep(${practiceStep+1})`)}</div></div>`)}
function nextPractice(){practiceId=null;practiceStep=0;render();window.scrollTo(0,0)}
function results(){let a=score('QR','diag'),b=score('MA','diag'),c=score('QR','mastery'),d=score('MA','mastery');return `<h2>Results & diagnostic error analysis</h2><p><strong>Units mastered:</strong> ${ITEMS.filter(mastered).length}/60 • <strong>Final assessment:</strong> ${unlocked()?'Unlocked':'Locked'} • <strong>Correct with hint:</strong> ${ITEMS.filter(q=>state.hints[q.id]&&result(q,'diag')===q.answer).length}</p><div class="grid">${[['QR diagnostic',a],['MA diagnostic',b],['QR mastery check',c],['MA mastery check',d]].map(([n,s])=>card(`<h3>${n}</h3><div class="metric">${s.correct}/${s.total}</div><p class="muted">${s.answered} attempted • ${s.answered?Math.round(100*s.correct/s.answered):0}% of attempted correct</p>${bar(s.correct,s.total)}`)).join('')}</div><div class="card"><h3>Item-by-item alignment and remediation</h3><p class="muted mini">Every row is linked to the corresponding numbered question in the uploaded ERB test. Incorrect diagnostic answers receive a complete worked correction in Practice.</p><div style="overflow:auto"><table><thead><tr><th>ERB ref</th><th>Skill</th><th>Diagnostic</th><th>Practice</th><th>Mastery</th><th>Correction</th></tr></thead><tbody>${ITEMS.map(q=>`<tr><td>${q.id}</td><td>${esc(q.skill)}</td><td>${status(q)}</td><td>${result(q,'practice')===undefined?'—':result(q,'practice')===q.answer?'Correct':'Retry'}</td><td>${result(q,'mastery')===undefined?'—':result(q,'mastery')===q.answer?'Correct':'Incorrect'}</td><td><button class="btn secondary" onclick="practiceId='${q.id}';filter='all';setPage('practice')">Open lesson</button></td></tr>`).join('')}</tbody></table></div></div><div class="actions">${button('Export progress',"exportProgress()")}${button('Print results',"window.print()",'secondary')}</div>`}
const TOOL_CARDS=[
['Geometry','Rectangle area','A = ℓ × w','Multiply length by width; use square units.'],
['Geometry','Rectangle perimeter','P = 2ℓ + 2w','Add all four sides; use linear units.'],
['Geometry','Square area','A = s²','Multiply side length by itself.'],
['Geometry','Square perimeter','P = 4s','Four equal sides.'],
['Geometry','Triangle area','A = ½bh','Multiply base by perpendicular height, then divide by 2.'],
['Geometry','Triangle perimeter','P = a + b + c','Add the three side lengths.'],
['Geometry','Rectangular prism volume','V = ℓ × w × h','Use cubic units.'],
['Geometry','Cube volume','V = s³','Multiply the edge length three times.'],
['Geometry','Circle circumference','C = 2πr = πd','r is radius; d is diameter.'],
['Geometry','Circle area','A = πr²','Square the radius before multiplying by π.'],
['Geometry','Angle relationships','Complementary = 90°; supplementary = 180°','Triangle interior angles total 180°; quadrilateral angles total 360°.'],
['Ratios & Rates','Unit rate','Unit rate = quantity ÷ number of units','For example, 120 miles ÷ 3 hours = 40 mph.'],
['Ratios & Rates','Proportions','a/b = c/d ⇒ ad = bc','Cross-products are equal when denominators are nonzero.'],
['Ratios & Rates','Speed','Speed = distance ÷ time','Rearrange: distance = speed × time.'],
['Ratios & Rates','Percent of a number','Part = (percent ÷ 100) × whole','25% of 80 = 0.25 × 80 = 20.'],
['Ratios & Rates','Percent change','Change % = (change ÷ original) × 100','Use the original amount as the denominator.'],
['Data & Probability','Mean','Mean = sum of values ÷ number of values','Add all observations and divide by the count.'],
['Data & Probability','Median','Median = middle value after sorting','For an even count, average the two middle values.'],
['Data & Probability','Mode','Mode = most frequent value','A data set may have more than one mode or no mode.'],
['Data & Probability','Range','Range = maximum − minimum','Measures the span of the data.'],
['Data & Probability','Probability','P(event) = favorable ÷ total outcomes','For equally likely outcomes only.'],
['Data & Probability','Circle graph','Sector fraction = angle ÷ 360°','Multiply the fraction by the total to estimate a category count.'],
['Numbers & Algebra','Order of operations','Grouping → exponents → ×/÷ → +/−','At the same priority, work left to right.'],
['Numbers & Algebra','Fraction addition','a/b + c/d = (ad + bc)/bd','Find a common denominator; simplify afterward.'],
['Numbers & Algebra','Fraction multiplication','(a/b)(c/d) = ac/bd','Multiply numerators and denominators.'],
['Numbers & Algebra','Fraction division','(a/b) ÷ (c/d) = (a/b)(d/c)','Multiply by the reciprocal of the divisor.'],
['Numbers & Algebra','Distributive property','a(b + c) = ab + ac','Multiply each term inside the parentheses.'],
['Numbers & Algebra','Distance on a number line','Distance = |a − b|','Absolute value makes distance nonnegative.']
];
const TOOL_DEFS={
'Symbols & Vocabulary':[['Variable (x, n, p, q)','A letter standing for a number that can vary.'],['ℓ, w, h, s','Length, width, height, and side length.'],['A, P, V, C','Area, perimeter, volume, and circumference. P(event) denotes probability.'],['r, d, π','Radius, diameter, and pi (approximately 3.14).'],['=, ≠, ≈','Equal, not equal, and approximately equal.'],['>, <, ≥, ≤','Greater than, less than, at least, and at most.'],['∩','Intersection: values or objects belonging to both sets.'],['(x, y)','An ordered pair: horizontal coordinate first, vertical second.'],['Factor and multiple','A factor divides a number exactly; a multiple is a product of that number and an integer.'],['Prime number','A whole number greater than 1 with exactly two positive factors.'],['Numerator / denominator','The top / bottom of a fraction; denominator indicates equal parts of the whole.'],['Equivalent fractions','Fractions representing the same value.']],
'Strategies':[['Read precisely','Underline the actual question; identify conditions such as NOT, BEST, and APPROXIMATELY.'],['Represent the situation','Sketch a diagram, make a table, write an equation, or use a number line.'],['Estimate first','Predict the approximate size of the answer to eliminate implausible choices.'],['Check units','Use consistent units; distinguish linear, square, and cubic units.'],['Use answer choices','Substitute choices when solving algebraically would take longer.'],['Visual reasoning','For grids, count equal areas; for Venn diagrams, interpret the overlap as AND.'],['Graph reading','Check labels, intervals, units, and scales before calculating.'],['Pacing','Skip a stubborn question and return later; answer every question because wrong answers carry no penalty.'],['Diagnostic hints','A correct response after viewing a hint is tracked as assisted, not mastered.']]
};
let toolTab='Flashcards',toolCategory='All',toolQuery='',toolFlipped={};
function setToolTab(t){toolTab=t;render()}
function flipToolCard(i){toolFlipped[i]=!toolFlipped[i];let el=document.getElementById('tool-card-'+i);if(el){el.classList.toggle('flipped',!!toolFlipped[i]);el.setAttribute('aria-label',toolFlipped[i]?'Answer shown. Activate to see formula.':'Formula shown. Activate to see explanation.');el.querySelector('.card-label').textContent=toolFlipped[i]?'EXPLANATION':'FORMULA';el.querySelector('.card-main').textContent=toolFlipped[i]?TOOL_CARDS[i][3]:TOOL_CARDS[i][2]}}
function library(){let cats=['All',...new Set(TOOL_CARDS.map(c=>c[0]))];let matches=TOOL_CARDS.map((c,i)=>({c,i})).filter(({c})=>(toolCategory==='All'||c[0]===toolCategory)&&c.join(' ').toLowerCase().includes(toolQuery.toLowerCase()));return `<div class="tool-header"><div><span class="pill">STUDY REFERENCE</span><h2 style="margin-top:9px">Math tools & formula flashcards</h2><p class="tool-intro">A clean, organized reference for Lower Level ISEE math. Tap a formula to reveal what it means and when to use it.</p></div><span class="pill">${TOOL_CARDS.length} formula cards</span></div><div class="tool-tabs">${['Flashcards','Symbols & Vocabulary','Strategies'].map(t=>`<button class="tool-tab ${toolTab===t?'active':''}" onclick="setToolTab('${t}')">${t}</button>`).join('')}</div>${toolTab==='Flashcards'?`<div class="card"><div class="row"><label><strong>Topic</strong> <select onchange="toolCategory=this.value;render()">${cats.map(c=>`<option ${c===toolCategory?'selected':''}>${c}</option>`).join('')}</select></label><label><strong>Search</strong> <input class="tool-search" placeholder="Find a formula or concept" value="${esc(toolQuery)}" oninput="toolQuery=this.value;render();document.querySelector('.tool-search')?.focus()"></label></div><p class="tool-tip">Showing ${matches.length} cards. Each card flips independently; use Tab and Enter for keyboard access.</p></div><div class="tool-grid">${matches.map(({c,i})=>`<button type="button" id="tool-card-${i}" class="flashcard ${toolFlipped[i]?'flipped':''}" onclick="flipToolCard(${i})" aria-label="${toolFlipped[i]?'Answer shown. Activate to see formula.':'Formula shown. Activate to see explanation.'}"><span class="card-label">${toolFlipped[i]?'EXPLANATION':'FORMULA'}</span><span class="front">${esc(c[1])}</span><span class="card-main ${toolFlipped[i]?'back':'front'}">${esc(toolFlipped[i]?c[3]:c[2])}</span><span class="tool-tip">${esc(c[0])} · Tap to flip</span></button>`).join('')||'<p>No matching formulas. Try another search.</p>'}</div>`:`<div class="tool-grid">${TOOL_DEFS[toolTab].map(([term,desc])=>`<section class="tool-panel"><h3>${esc(term)}</h3><p>${esc(desc)}</p></section>`).join('')}</div>`}<div class="card" style="margin-top:20px"><h3>About this reference</h3><p class="muted mini">These are study aids for the math topics represented in the attached 2016 ERB Lower Level ISEE practice test. The reference includes some useful extension formulas; not every formula appears on that specific test. This is an independent preparation resource, not an official ERB formula sheet.</p></div>`}
function settings(){return card(`<h2>Data & settings</h2><p>Progress is stored in this browser. Export a JSON backup to transfer between devices, then import it on the destination device. Import replaces the current browser's progress.</p><div class="actions">${button('Export progress JSON',"exportProgress()")} <label class="btn secondary" style="display:inline-block;cursor:pointer">Import progress JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></label>${button('Reset progress',"resetProgress()",'secondary')}</div><p class="muted mini">There is no server synchronization, student login, or teacher dashboard in this standalone version.</p>`)}
function exportProgress(){let data=JSON.stringify({exportedAt:new Date().toISOString(),progress:state},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='isee-math-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(el){let file=el.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text()),v=data.progress??data;if(!v||typeof v!=='object'||!['diag','practice','mastery'].every(k=>v[k]&&typeof v[k]==='object'&&!Array.isArray(v[k])))throw Error('Invalid progress structure');if(!confirm('Replace progress in this browser with the imported file?'))return;state={diag:v.diag,practice:v.practice,mastery:v.mastery,flags:v.flags??{},hints:v.hints??{},extra:v.extra??{}};save();render();alert('Progress imported successfully.')}catch(e){alert('Import failed: '+e.message)}finally{el.value=''}}
function resetProgress(){if(confirm('Delete all locally saved ISEE Math progress?')){state={diag:{},practice:{},mastery:{},flags:{},hints:{},extra:{}};save();setPage('home')}}
const STAGES=[['QR','diag','QR Diagnostic'],['QR','practice','QR Practice'],['QR','mastery','QR Mastery Assessment'],['MA','diag','MA Diagnostic'],['MA','practice','MA Practice'],['MA','mastery','MA Mastery Assessment']];
function goStage(i){let [s,m]=STAGES[i];section=s;if(m==='practice'){practiceId=null;filter='all';setPage('practice')}else openTest(m,s)}
function stageStrip(){let current=page==='test'?STAGES.findIndex(x=>x[0]===section&&x[1]===mode):page==='practice'?STAGES.findIndex(x=>x[0]===section&&x[1]==='practice'):-1;return `<div class="pathway"><div class="pathway-label">YOUR SIX-STEP MATH PATHWAY <span>Complete QR, then MA</span></div><div class="pathway-steps">${STAGES.map(([s,m,name],i)=>{let done=m==='diag'?score(s,'diag').answered===qs(s).length:m==='practice'?unlocked(s):score(s,'mastery').answered===testQs(s,'mastery').length;let locked=m==='mastery'&&!unlocked(s);return `<button class="pathway-step ${current===i?'current':''} ${done?'done':''}" onclick="goStage(${i})" aria-current="${current===i?'step':'false'}"><span class="step-number">${done?'✓':i+1}</span><span>${name}</span>${locked?'<small>🔒 Locked</small>':done?'<small>Complete</small>':''}</button>`}).join('')}</div></div>`}
function stageFooter(){let i=page==='test'?STAGES.findIndex(x=>x[0]===section&&x[1]===mode):page==='practice'?STAGES.findIndex(x=>x[0]===section&&x[1]==='practice'):-1;if(i<0||i>=5)return '';return `<div class="card next-stage"><strong>Next step: ${STAGES[i+1][2]}</strong><p>Continue through the pathway when you are ready. Mastery assessments unlock when all units in that section are mastered.</p>${button('Continue to '+STAGES[i+1][2],`goStage(${i+1})`)}</div>`}
function render(){app.innerHTML=stageStrip()+(page==='home'?home():page==='test'?test():page==='practice'?practice():page==='results'?results():page==='library'?library():settings())+stageFooter()}
document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>setPage(x.dataset.nav));render();
</script></body></html>
